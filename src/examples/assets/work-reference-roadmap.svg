<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Arial, PingFang SC, sans-serif" data-workplace="roadmap"><title>产品路线图 · 季度交付</title><desc>按工作流展示发现、基础能力、体验与增长的季度交付安排。示意数据，非生产配置。</desc><defs><marker id="work-reference-roadmap-arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#6b7178"/></marker><marker id="work-reference-roadmap-crow" viewBox="0 0 12 12" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12 0L0 6L12 12M0 6H12" stroke="#6b7178" fill="none"/></marker></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#fdfdfd" stroke="none" stroke-width="2"/><text x="56" y="66" font-size="36" fill="#292b2f" font-weight="700" >产品路线图 · 季度交付</text><text x="56" y="106" font-size="19" fill="#6b7178" font-weight="400" >按工作流展示发现、基础能力、体验与增长的季度交付安排</text><rect x="300" y="176" width="300" height="690" rx="0" fill="#f3f6fd" stroke="#cbd5e1" stroke-width="2"/><text x="320" y="215" font-size="23" fill="#292b2f" font-weight="600" >Q1 · 发现</text><rect x="600" y="176" width="300" height="690" rx="0" fill="#f3f6fd" stroke="#cbd5e1" stroke-width="2"/><text x="620" y="215" font-size="23" fill="#292b2f" font-weight="600" >Q2 · 建设</text><rect x="900" y="176" width="300" height="690" rx="0" fill="#f3f6fd" stroke="#cbd5e1" stroke-width="2"/><text x="920" y="215" font-size="23" fill="#292b2f" font-weight="600" >Q3 · 验证</text><rect x="1200" y="176" width="300" height="690" rx="0" fill="#f3f6fd" stroke="#cbd5e1" stroke-width="2"/><text x="1220" y="215" font-size="23" fill="#292b2f" font-weight="600" >Q4 · 扩展</text><rect x="48" y="258" width="230" height="126" rx="8" fill="#f3f6fd" stroke="#2451c4" stroke-width="2"/><text x="68" y="291" font-size="21" fill="#292b2f" font-weight="600" >用户研究</text><rect x="48" y="408" width="230" height="126" rx="8" fill="#f8f5fe" stroke="#6