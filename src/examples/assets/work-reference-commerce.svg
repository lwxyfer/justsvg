ddle">业务规则 / 幂等校验</text></g><g id="work-reference-commerce-cache" data-node="true" data-label="Redis 缓存" data-layout="80 736 290 104"><rect x="80" y="736" width="290" height="104" rx="8" fill="#d2f5ee" stroke="#14786b" stroke-width="2"/><text x="225" y="770" font-size="23" fill="#292b2f" font-weight="700" text-anchor="middle">Redis 缓存</text><text x="225" y="802" font-size="18" fill="#45484d" font-weight="400" text-anchor="middle">热点商品 / 会话</text></g><g id="work-reference-commerce-db" data-node="true" data-label="业务数据库" data-layout="460 736 290 104"><rect x="460" y="736" width="290" height="104" rx="8" fill="#d2f5ee" stroke="#14786b" stroke-width="2"/><text x="605" y="770" font-size="23" fill="#292b2f" font-weight="700" text-anchor="middle">业务数据库</text><text x="605" y="802" font-size="18" fill="#45484d" font-weight="400" text-anchor="middle">订单 / 支付记录</text></g><g id="work-reference-commerce-bus" data-node="true" data-label="事件总线" data-layout="840 736 290 104"><rect x="840" y="736" width="290" height="104" rx="8" fill="#fbead0" stroke="#80600c" stroke-width="2"/><text x="985" y="770" font-size="23" fill="#292b2f" font-weight="700" text-anchor="middle">事件总线</text><text x="985" y="802" font-size="18" fill="#45484d" font-weight="400" text-anchor="middle">OrderCreated / Paid</text></g><g id="work-reference-commerce-stock" data-node="true" data-label="库存数据库" data-layout="1220 736 290 104"><rect x="1220" y="736" width="290" height="104" rx="8" fill="#d2f5ee" stroke="#14786b" stroke-width="2"/><text x="1365" y="770" font-size="23" fill="#292b2f" font-weight="700" text-anchor="middle">库存数据库</text><text x="1365" y="802" font-size="18" fill="#45484d" font-weight="400" text-anchor="middle">预占 / 扣减</text></g><text x="80" y="930" font-size="18" fill="#6b7178" font-weight="400" >同步 API 处理请求；领域事件支撑异步协作。图中服务与存储为示意拆分。</text><text x="56" y="970" font-size="16" fill="#6b7178" font-weight="400" >工作场景示例 · 数据与部署均为演示 · 原生文字 / 分组 / 关联线可编辑</text></svg>
