<polyline id="notes-edge-chunks-embed" points="580,306.0 620,306.0" fill="none" stroke="#776d58" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#notes-arrow-main)" data-sf-start-node="#notes-node-chunks" data-sf-end-node="#notes-node-embed" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0" stroke-dasharray="6 4"/>
