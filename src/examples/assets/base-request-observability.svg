<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Arial, PingFang SC, sans-serif" data-visual-style="standard"><title>请求生命周期 · 可观测性信息图</title><desc>基础信息图演变 · 用流程、字段矩阵和实施约束解释一次请求</desc><defs><marker id="base-request-observability-arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#647f9e"/></marker><marker id="base-request-observability-arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a16207"/></marker><marker id="base-request-observability-arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#047857"/></marker><marker id="base-request-observability-arrow-scope" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="1400" height="900" fill="#fff" stroke="none" rx="0" stroke-width="1.4"/><text x="40" y="48" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">请求生命周期 · 可观测性信息图</text><text x="40" y="78" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">基础信息图演变 · 用流程、字段矩阵和实施约束解释一次请求</text><path d="M40 106h36" fill="none" stroke="#647f9e" stroke-width="1.8"/><text x="86" y="110" font-size="12" fill="#475569" font-weight="400" text-anchor="start">请求阶段与依赖</text><g id="base-request-observability-layer-lifecycle" data-label="请求链路"><rect x="32" y="136" width="1336" height="196" fill="#ffffff" stroke="#93b4ef" rx="8" stroke-width="1.4"/><text x="48" y="165" font-size="15" fill="#1d4ed8" font-weight="600" text-anchor="start">请求链路</text><g id="base-request-observability-node-client" data-node="true" data-label="客户端"><rect x="50" y="194" width="190" height="100" fill="#eff6ff" stroke="#93b4ef" rx="8" stroke-width="1.4"/><text x="64" y="222" font-size="17" fill="#1d4ed8" font-weight="600" text-anchor="start">客户端</text><text x="64" y="246" font-size="13" fill="#475569" font-weight="400" text-anchor="start">发起请求 · 关联标识</text></g><g id="base-request-observability-node-ingress" data-node="true" data-label="接入网关"><rect x="270" y="194" width="190" height="100" fill="#eff6ff" stroke="#93b4ef" rx="8" stroke-width="1.4"/><text x="284" y="222" font-size="17" fill="#1d4ed8" font-weight="600" text-anchor="start">接入网关</text><text x="284" y="246" font-size="13" fill="#475569" font-weight="400" text-anchor="start">路由 · 限流 · 记录入口</text></g><g id="base-request-observability-node-auth" data-node="true" data-label="身份鉴权"><rect x="490" y="194" width="190" height="100" fill="#f5f3ff" stroke="#b8a0e8" rx="8" stroke-width="1.4"/><text x="504" y="222" font-size="17" fill="#6d28d9" font-weight="600" text-anchor="start">身份鉴权</text><text x="504" y="246" font-size="13" fill="#475569" font-weight="400" text-anchor="start">校验令牌 · 授权策略</text></g><g id="base-request-observability-node-service" data-node="true" data-label="业务服务"><rect x="710" y="194" width="190" height="100" fill="#f5f3ff" stroke="#b8a0e8" rx="8" stroke-width="1.4"/><text x="724" y="222" font-size="17" fill="#6d28d9" font-weight="600" text-anchor="start">业务服务</text><text x="724" y="246" font-size="13" fill="#475569" font-weight="400" text-anchor="start">规则执行 · 服务调用</text></g><g id="base-request-observability-node-store" data-node="true" data-label="数据访问"><rect x="930" y="194" width="190" height="100" fill="#ecfdf5" stroke="#80c5ad" rx="8" stroke-width="1.4"/><text x="944" y="222" font-size="17" fill="#047857" font-weight="600" text-anchor="start">数据访问</text><text x="944" y="246" font-size="13" fill="#475569" font-weight="400" text-anchor="start">查询 · 缓存 · 事务</text></g><g id="base-request-observability-node-response" data-node="true" data-label="响应输出"><rect x="1150" y="194" width="190" height="100" fill="#ecfdf5" stroke="#80c5ad" rx="8" stroke-width="1.4"/><text x="1164" y="222" font-size="17" fill="#047857" font-weight="600" text-anchor="start">响应输出</text><text x="1164" y="246" font-size="13" fill="#475569" font-weight="400" text-anchor="start">状态码 · 返回业务结果</text></g></g><g id="base-request-observability-layer-signals" data-label="观测信号与记录口径"><rect x="32" y="392" width="660" height="344" fill="#ffffff" stroke="#b8a0e8" rx="8" stroke-width="1.4"/><text x="48" y="421" font-size="15" fill="#6d28d9" font-weight="600" text-anchor="start">观测信号与记录口径</text><text x="52" y="462" font-size="12" fill="#64748b" font-weight="600" text-anchor="start">信号</text><text x="224" y="462" font-size="12" fill="#64748b" font-weight="600" text-anchor="start">示例字段</text><text x="468" y="462" font-size="12" fill="#64748b" font-weight="600" text-anchor="start">用途</text><g id="base-request-observability-node-trace" data-node="true" data-label="Trace / 链路"><rect x="48" y="482" width="628" height="60" fill="#f8fafc" stroke="none" rx="8" stroke-width="1.4"/><text x="60" y="516" font-size="14" fill="#334155" font-weight="600" text-anchor="start">Trace / 链路</text><text x="224" y="516" font-size="12" fill="#475569" font-weight="400" text-anchor="start">trace_id · span_id</text><text x="468" y="516" font-size="12" fill="#475569" font-weight="400" text-anchor="start">定位请求耗时与依赖</text></g><g id="base-request-observability-node-metrics" data-node="true" data-label="Metrics / 指标"><rect x="48" y="558" width="628" height="60" fill="#fff" stroke="none" rx="8" stroke-width="1.4"/><text x="60" y="592" font-size="14" fill="#334155" font-weight="600" text-anchor="start">Metrics / 指标</text><text x="224" y="592" font-size="12" fill="#475569" font-weight="400" text-anchor="start">count · errors · latency</text><text x="468" y="592" font-size="12" fill="#475569" font-weight="400" text-anchor="start">按服务聚合趋势与告警</text></g><g id="base-request-observability-node-logs" data-node="true" data-label="Logs / 日志"><rect x="48" y="634" width="628" height="60" fill="#f8fafc" stroke="none" rx="8" stroke-width="1.4"/><text x="60" y="668" font-size="14" fill="#334155" font-weight="600" text-anchor="start">Logs / 日志</text><text x="224" y="668" font-size="12" fill="#475569" font-weight="400" text-anchor="start">request_id · error_code</text><text x="468" y="668" font-size="12" fill="#475569" font-weight="400" text-anchor="start">补充错误与业务上下文</text></g></g><g id="base-request-observability-layer-constraints" data-label="实施约束与阅读提示"><rect x="728" y="392" width="640" height="344" fill="#ffffff" stroke="#80c5ad" rx="8" stroke-width="1.4"/><text x="744" y="421" font-size="15" fill="#047857" font-weight="600" text-anchor="start">实施约束与阅读提示</text><g id="base-request-observability-node-sampling" data-node="true" data-label="采样策略"><rect x="748" y="452" width="600" height="72" fill="#eff6ff" stroke="#93b4ef" rx="8" stroke-width="1.4"/><text x="762" y="480" font-size="17" fill="#1d4ed8" font-weight="600" text-anchor="start">采样策略</text><text x="762" y="504" font-size="13" fill="#475569" font-weight="400" text-anchor="start">关键路径优先，采样比例按排障需求与成本决定。</text></g><g id="base-request-observability-node-correlation" data-node="true" data-label="关联与脱敏"><rect x="748" y="544" width="600" height="72" fill="#f5f3ff" stroke="#b8a0e8" rx="8" stroke-width="1.4"/><text x="762" y="572" font-size="17" fill="#6d28d9" font-weight="600" text-anchor="start">关联与脱敏</text><text x="762" y="596" font-size="13" fill="#475569" font-weight="400" text-anchor="start">统一标识关联信号，避免记录敏感字段与完整载荷。</text></g><g id="base-request-observability-node-retention" data-node="true" data-label="保留与告警"><rect x="748" y="636" width="600" height="72" fill="#ecfdf5" stroke="#80c5ad" rx="8" stroke-width="1.4"/><text x="762" y="664" font-size="17" fill="#047857" font-weight="600" text-anchor="start">保留与告警</text><text x="762" y="688" font-size="13" fill="#475569" font-weight="400" text-anchor="start">按用途配置保留周期；阈值依据实际服务目标确定。</text></g></g><g data-label="client → ingress"><polyline id="base-request-observability-edge-stage-0" points="244,244 266,244" fill="none" stroke="#647f9e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-request-observability-arrow-sync)" data-sf-start-node="#base-request-observability-node-client" data-sf-end-node="#base-request-observability-node-ingress" data-sf-start-anchor="1.000000 0.500000 4.00 0.00" data-sf-end-anchor="0.000000 0.500000 -4.00 0.00"/></g><g data-label="ingress → auth"><polyline id="base-request-observability-edge-stage-1" points="464,244 486,244" fill="none" stroke="#647f9e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-request-observability-arrow-sync)" data-sf-start-node="#base-request-observability-node-ingress" data-sf-end-node="#base-request-observability-node-auth" data-sf-start-anchor="1.000000 0.500000 4.00 0.00" data-sf-end-anchor="0.000000 0.500000 -4.00 0.00"/></g><g data-label="auth → service"><polyline id="base-request-observability-edge-stage-2" points="684,244 706,244" fill="none" stroke="#647f9e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-request-observability-arrow-sync)" data-sf-start-node="#base-request-observability-node-auth" data-sf-end-node="#base-request-observability-node-service" data-sf-start-anchor="1.000000 0.500000 4.00 0.00" data-sf-end-anchor="0.000000 0.500000 -4.00 0.00"/></g><g data-label="service → store"><polyline id="base-request-observability-edge-stage-3" points="904,244 926,244" fill="none" stroke="#647f9e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-request-observability-arrow-sync)" data-sf-start-node="#base-request-observability-node-service" data-sf-end-node="#base-request-observability-node-store" data-sf-start-anchor="1.000000 0.500000 4.00 0.00" data-sf-end-anchor="0.000000 0.500000 -4.00 0.00"/></g><g data-label="store → response"><polyline id="base-request-observability-edge-stage-4" points="1124,244 1146,244" fill="none" stroke="#647f9e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-request-observability-arrow-sync)" data-sf-start-node="#base-request-observability-node-store" data-sf-end-node="#base-request-observability-node-response" data-sf-start-anchor="1.000000 0.500000 4.00 0.00" data-sf-end-anchor="0.000000 0.500000 -4.00 0.00"/></g><rect x="32" y="788" width="1336" height="68" fill="#f8fafc" stroke="#dce4ee" rx="8" stroke-width="1.4"/><text x="52" y="817" font-size="15" fill="#334155" font-weight="600" text-anchor="start">阅读方式</text><text x="196" y="817" font-size="14" fill="#475569" font-weight="400" text-anchor="start">先沿请求链路定位阶段，再用统一标识关联链路、指标和日志。</text><text x="196" y="841" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">图中字段为说明示例，采样与保留策略根据实际服务约束配置。</text></svg>
