xt x="72" y="930" font-size="18" fill="#64748b" font-weight="400" >示意拓扑，不构成高可用承诺；副本数、网络与故障策略需按实际环境设计。</text><text x="56" y="970" font-size="16" fill="#64748b" font-weight="400" >工作场景示例 · 数据与部署均为演示 · 原生文字 / 分组 / 关联线可编辑</text></svg>
