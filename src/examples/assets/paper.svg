<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Georgia, Songti SC, serif">
<title>黑白论文 · RAG 架构图</title>
<desc>原生可编辑示例。设计 Prompt 见 src/examples/prompts/paper.md。演示架构，非生产配置。</desc>
<defs><marker id="paper-arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#484848" stroke-width="1.5"/></marker><marker id="paper-arrow-online" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#287b65" stroke-width="1.5"/></marker><marker id="paper-arrow-cross" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#525252" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1200" height="800" fill="#ffffff" stroke="none" rx="0" stroke-width="1"/>
<text x="600" y="100" font-size="32" fill="#171717" font-weight="600" text-anchor="middle">Figure 1. Retrieval-augmented generation</text>
<text x="600" y="142" font-size="16" fill="#525252" font-weight="400" text-anchor="middle">A schematic of indexing, retrieval and grounded answering.</text>
<line x1="60" y1="170" x2="1140" y2="170" stroke="#484848" stroke-width="0.8"/>
<text x="60" y="215" font-size="16" fill="#171717" font-weight="600" text-anchor="start">离线索引 / INDEXING</text>
<text x="60" y="505" font-size="16" fill="#171717" font-weight="600" text-anchor="start">在线回答 / ANSWERING</text>
<g id="paper-connections" data-label="连接线"><polyline id="paper-edge-docs-chunks" points="300,306.0 340,306.0" fill="none" stroke="#484848" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#paper-arrow-main)" data-sf-start-node="#paper-node-docs" data-sf-end-node="#paper-node-chunks" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="paper-edge-chunks-embed" points="580,306.0 620,306.0" fill="none" stroke="#484848" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#paper-arrow-main)" data-sf-start-node="#paper-node-chunks" data-sf-end-node="#paper-node-embed" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="paper-edge-embed-index" points="860,306.0 900,306.0" fill="none" stroke="#484848" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#paper-arrow-main)" data-sf-start-node="#paper-node-embed" data-sf-end-node="#paper-node-index" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="paper-edge-query-retrieve" points="220,606.0 290,606.0" fill="none" stroke="#484848" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#paper-arrow-main)" data-sf-start-node="#paper-node-query" data-sf-end-node="#paper-node-retrieve" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="paper-edge-retrieve-context" points="450,606.0 520,606.0" fill="none" stroke="#484848" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#paper-arrow-main)" data-sf-start-node="#paper-node-retrieve" data-sf-end-node="#paper-node-context" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="paper-edge-context-llm" points="680,606.0 750,606.0" fill="none" stroke="#484848" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#paper-arrow-main)" data-sf-start-node="#paper-node-context" data-sf-end-node="#paper-node-llm" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="paper-edge-llm-answer" points="910,606.0 980,606.0" fill="none" stroke="#484848" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#paper-arrow-main)" data-sf-start-node="#paper-node-llm" data-sf-end-node="#paper-node-answer" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="paper-edge-index-retrieve" points="1020.0,362 1020.0,440 370.0,440 370.0,550" fill="none" stroke="#484848" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#paper-arrow-main)" data-sf-start-node="#paper-node-index" data-sf-end-node="#paper-node-retrieve" data-sf-start-anchor=".5 1 0 0" data-sf-end-anchor=".5 0 0 0" stroke-dasharray="6 4"/></g>
<g id="paper-node-docs" data-label="Documents / 文档与知识库" data-node="true"><rect x="60" y="250" width="240" height="112" fill="#ffffff" stroke="#484848" rx="0" stroke-width="1.2"/>
<text x="180.0" y="296" font-size="24" fill="#171717" font-weight="600" text-anchor="middle">Documents</text>
<text x="180.0" y="327" font-size="14" fill="#525252" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">文档与知识库</text>
<circle cx="60" cy="306" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/>
<circle cx="300" cy="306" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/></g>
<g id="paper-node-chunks" data-label="Chunking / 解析与切分" data-node="true"><rect x="340" y="250" width="240" height="112" fill="#ffffff" stroke="#484848" rx="0" stroke-width="1.2"/>
<text x="460.0" y="296" font-size="24" fill="#171717" font-weight="600" text-anchor="middle">Chunking</text>
<text x="460.0" y="327" font-size="14" fill="#525252" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">解析与切分</text>
<circle cx="340" cy="306" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/>
<circle cx="580" cy="306" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/></g>
<g id="paper-node-embed" data-label="Embeddings / 向量编码" data-node="true"><rect x="620" y="250" width="240" height="112" fill="#ffffff" stroke="#484848" rx="0" stroke-width="1.2"/>
<text x="740.0" y="296" font-size="24" fill="#171717" font-weight="600" text-anchor="middle">Embeddings</text>
<text x="740.0" y="327" font-size="14" fill="#525252" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">向量编码</text>
<circle cx="620" cy="306" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/>
<circle cx="860" cy="306" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/></g>
<g id="paper-node-index" data-label="Vector index / 向量索引" data-node="true"><rect x="900" y="250" width="240" height="112" fill="#ffffff" stroke="#484848" rx="0" stroke-width="1.2"/>
<text x="1020.0" y="296" font-size="24" fill="#171717" font-weight="600" text-anchor="middle">Vector index</text>
<text x="1020.0" y="327" font-size="14" fill="#525252" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">向量索引</text>
<circle cx="900" cy="306" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/>
<circle cx="1140" cy="306" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/></g>
<g id="paper-node-query" data-label="User query / 用户问题" data-node="true"><rect x="60" y="550" width="160" height="112" fill="#ffffff" stroke="#484848" rx="0" stroke-width="1.2"/>
<text x="140.0" y="596" font-size="20" fill="#171717" font-weight="600" text-anchor="middle">User query</text>
<text x="140.0" y="627" font-size="14" fill="#525252" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">用户问题</text>
<circle cx="60" cy="606" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/>
<circle cx="220" cy="606" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/></g>
<g id="paper-node-retrieve" data-label="Retriever / 相似度检索" data-node="true"><rect x="290" y="550" width="160" height="112" fill="#ffffff" stroke="#484848" rx="0" stroke-width="1.2"/>
<text x="370.0" y="596" font-size="20" fill="#171717" font-weight="600" text-anchor="middle">Retriever</text>
<text x="370.0" y="627" font-size="14" fill="#525252" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">相似度检索</text>
<circle cx="290" cy="606" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/>
<circle cx="450" cy="606" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/></g>
<g id="paper-node-context" data-label="Context / 上下文构建" data-node="true"><rect x="520" y="550" width="160" height="112" fill="#ffffff" stroke="#484848" rx="0" stroke-width="1.2"/>
<text x="600.0" y="596" font-size="20" fill="#171717" font-weight="600" text-anchor="middle">Context</text>
<text x="600.0" y="627" font-size="14" fill="#525252" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">上下文构建</text>
<circle cx="520" cy="606" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/>
<circle cx="680" cy="606" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/></g>
<g id="paper-node-llm" data-label="LLM / 生成模型" data-node="true"><rect x="750" y="550" width="160" height="112" fill="#ffffff" stroke="#484848" rx="0" stroke-width="1.2"/>
<text x="830.0" y="596" font-size="20" fill="#171717" font-weight="600" text-anchor="middle">LLM</text>
<text x="830.0" y="627" font-size="14" fill="#525252" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">生成模型</text>
<circle cx="750" cy="606" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/>
<circle cx="910" cy="606" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/></g>
<g id="paper-node-answer" data-label="Answer / 回答与引用" data-node="true"><rect x="980" y="550" width="160" height="112" fill="#ffffff" stroke="#484848" rx="0" stroke-width="1.2"/>
<text x="1060.0" y="596" font-size="20" fill="#171717" font-weight="600" text-anchor="middle">Answer</text>
<text x="1060.0" y="627" font-size="14" fill="#525252" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">回答与引用</text>
<circle cx="980" cy="606" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/>
<circle cx="1140" cy="606" r="2.5" fill="#171717" stroke="#484848" stroke-width="1"/></g>
<line x1="60" y1="715" x2="1140" y2="715" stroke="#484848" stroke-width="0.7"/>
<text x="60" y="748" font-size="14" fill="#525252" font-weight="400" text-anchor="start">RAG / Retrieval-augmented generation</text>
<text x="60" y="776" font-size="12" fill="#525252" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif">演示架构 · 可编辑节点与文字 · 非生产配置</text>
</svg>
