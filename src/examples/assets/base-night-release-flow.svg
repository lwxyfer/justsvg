nt-size="12" fill="#e8c17b" font-weight="400" text-anchor="middle">未通过：修复后重试</text></g></g><g data-label="canary → observe"><polyline id="base-night-release-flow-edge-canary-observe" points="786,610 674,610" fill="none" stroke="#92b4dc" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-night-release-flow-arrow-sync)" data-sf-start-node="#base-night-release-flow-node-canary" data-sf-end-node="#base-night-release-flow-node-observe" data-sf-start-anchor="0.000000 0.500000 -4.00 0.00" data-sf-end-anchor="1.000000 0.500000 4.00 0.00"/></g><g data-label="验证正常"><polyline id="base-night-release-flow-edge-observe-release" points="486,610 374,610" fill="none" stroke="#92b4dc" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-night-release-flow-arrow-sync)" data-sf-start-node="#base-night-release-flow-node-observe" data-sf-end-node="#base-night-release-flow-node-release" data-sf-start-anchor="0.000000 0.500000 -4.00 0.00" data-sf-end-anchor="1.000000 0.500000 4.00 0.00"/><g data-sf-label-for="#base-night-release-flow-edge-observe-release"><text x="430" y="596" font-size="12" fill="#92b4dc" font-weight="400" text-anchor="middle">验证正常</text></g></g><g data-label="运行异常"><polyline id="base-night-release-flow-edge-rollback" points="580,650 580,718 880,718 880,776" fill="none" stroke="#e8c17b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-night-release-flow-arrow-async)" stroke-dasharray="6 4" data-sf-start-node="#base-night-release-flow-node-observe" data-sf-end-node="#base-night-release-flow-node-rollback" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00"/><g data-sf-label-for="#base-night-release-flow-edge-rollback"><text x="720" y="706" font-size="12" fill="#e8c17b" font-weight="400" text-anchor="middle">运行异常</text></g></g></svg>
