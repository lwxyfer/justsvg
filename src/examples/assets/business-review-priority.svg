<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Arial, PingFang SC, sans-serif" data-business-subject="priority" data-work-style="review"><title>需求价值与投入矩阵 · 工作评审</title><desc>岗位：产品、设计、管理层。原创工作示例，内容、日期与数据均为演示。图形与文字为原生SVG。</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f5f7fb" stroke="none" stroke-width="1.3"/><text x="64" y="78" font-size="37" fill="#21354b" font-weight="700" >需求价值与投入矩阵</text><text x="67" y="120" font-size="21" fill="#54677c" font-weight="400" >用价值和投入讨论六项产品需求的推进顺序</text><text x="1536" y="168" font-size="18" fill="#54677c" font-weight="400" text-anchor="end">产品 / 设计 / 管理层 · 工作评审</text><g id="business-review-priority-diagram" transform="translate(64 210) scale(1)"><defs><marker id="business-review-priority-arrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315fa1"/></marker></defs><rect x="100" y="50" width="1280" height="550" rx="0" fill="#fff" stroke="#9cabb9" stroke-width="1.3"/><rect x="100" y="50" width="640" height="275" rx="0" fill="#edf6f2" stroke="none" stroke-width="1.3"/><rect x="740" y="325" width="640" height="275" rx="0" fill="#f3f5f7" stroke="none" stroke-width="1.3"/><polyline points="740,50 740,600" fill="none" stroke="#9cabb9" stroke-width="1.8" /><polyline points="100,325 1380,325" fill="none" stroke="#9cabb9" stroke-width="1.8" /><g id="business-review-priority-onboard" data-node="true" data-label="压缩首次配置" data-layout="165 150 220 68"><rect x="165" y="150" width="220" height="68" rx="6" fill="#edf6f2" stroke="#9dbfad" stroke-width="1.3"/><text x="183" y="184" font-size="24" fill="#21354b" font-weight="600" >压缩首次配置</text></g><g id="business-review-priority-feedback" data-node="true" data-label="反馈聚合" data-layout="430 225 220 68"><rect x="430" y="225" width="220" height="68" rx="6" fill="#edf6f2" stroke="#9dbfad" stroke-width="1.3"/><text x="448" y="259" font-