<text x="777" y="599" font-size="19" fill="#253b55" font-weight="600" text-anchor="start">LLM</text>
<text x="777" y="631" font-size="14" fill="#516781" font-weight="400" text-anchor="start">生成模型</text></g>
<g id="swimlane-node-answer" data-label="Answer / 回答与引用" data-node="true"><rect x="970" y="550" width="170" height="112" fill="#ffffff" stroke="#607e9f" rx="0" stroke-width="1"/>
