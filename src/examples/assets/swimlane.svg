<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Arial, PingFang SC, sans-serif">
<title>流程泳道 · RAG 架构图</title>
<desc>原生可编辑示例。设计 Prompt 见 src/examples/prompts/swimlane.md。演示架构，非生产配置。</desc>
<defs><marker id="swimlane-arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#607e9f"/></marker><marker id="swimlane-arrow-online" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#287b65"/></marker><marker id="swimlane-arrow-cross" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#516781"/></marker></defs>
<rect x="0" y="0" width="1200" height="800" fill="#ffffff" stroke="none" rx="0" stroke-width="1"/>
<text x="60" y="100" font-size="44" fill="#253b55" font-weight="500" text-anchor="start">知识管线 / RAG</text>
<text x="60" y="143" font-size="16" fill="#516781" font-weight="400" text-anchor="start">分阶段理解知识如何进入回答</text>
<line x1="60" y1="174" x2="1140" y2="174" stroke="#607e9f" stroke-width="1"/>
<rect x="50" y="200" width="1100" height="190" fill="#edf3fa" stroke="#607e9f" rx="0" stroke-width="1"/>
<rect x="50" y="485" width="1100" height="200" fill="#edf6f2" stroke="#607e9f" rx="0" stroke-width="1"/>
<line x1="130" y1="200" x2="130" y2="390" stroke="#607e9f" stroke-width="1"/>
<line x1="130" y1="485" x2="130" y2="685" stroke="#607e9f" stroke-width="1"/>
<text x="70" y="231" font-size="13" fill="#245a94" font-weight="600" text-anchor="start">INDEX</text>
<text x="70" y="256" font-size="14" fill="#516781" font-weight="400" text-anchor="start">离线</text>
<text x="65" y="516" font-size="12" fill="#245a94" font-weight="600" text-anchor="start">ANSWER</text>
<text x="70" y="541" font-size="14" fill="#516781" font-weight="400" text-anchor="start">在线</text>
<g id="swimlane-connections" data-label="连接线"><polyline id="swimlane-edge-docs-chunks" points="380,306.0 420,306.0" fill="none" stroke="#607e9f" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#swimlane-arrow-main)" data-sf-start-node="#swimlane-node-docs" data-sf-end-node="#swimlane-node-chunks" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="swimlane-edge-chunks-embed" points="630,306.0 670,306.0" fill="none" stroke="#607e9f" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#swimlane-arrow-main)" data-sf-start-node="#swimlane-node-chunks" data-sf-end-node="#swimlane-node-embed" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="swimlane-edge-embed-index" points="880,306.0 920,306.0" fill="none" stroke="#607e9f" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#swimlane-arrow-main)" data-sf-start-node="#swimlane-node-embed" data-sf-end-node="#swimlane-node-index" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
