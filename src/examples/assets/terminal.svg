<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
<title>终端控制台 · RAG 架构图</title>
<desc>设计 Prompt 见 src/examples/prompts/terminal.md。原生可编辑 SVG，演示结构。</desc>
<defs><marker id="terminal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#578877"/></marker></defs>
<rect x="0" y="0" width="1200" height="800" fill="#101b1c" stroke="none" rx="0" stroke-width="1"/>
<rect x="28" y="28" width="1144" height="756" fill="#101b1c" stroke="#578877" rx="8" stroke-width="1"/>
<line x1="28" y1="68" x2="1172" y2="68" stroke="#578877" stroke-width="1"/>
<circle cx="52" cy="48" r="4" fill="#d28677"/>
<circle cx="71" cy="48" r="4" fill="#d8bd76"/>
<circle cx="90" cy="48" r="4" fill="#77b99c"/>
<text x="134" y="53" fill="#a7c5ba" font-size="13" font-weight="400">rag-system.svg  —  topology / local</text>
<text x="60" y="122" fill="#7ee4ba" font-size="32" font-weight="400">$ inspect rag --topology</text>
<text x="60" y="157" fill="#a7c5ba" font-size="14" font-weight="400">native SVG · 9 nodes · offline indexing + online answering</text>
<text x="60" y="215" fill="#7ee4ba" font-size="16" font-weight="600">INDEXING</text>
<text x="60" y="505" fill="#7ee4ba" font-size="16" font-weight="600">ANSWERING</text>
<g id="terminal-connections" data-label="连接线"><polyline id="terminal-edge-docs-chunks" points="300,306.0 340,306.0" fill="none" stroke="#578877" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#terminal-arrow)" data-sf-start-node="#terminal-node-docs" data-sf-end-node="#terminal-node-chunks" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="terminal-edge-chunks-embed" points="580,306.0 620,306.0" fill="none" stroke="#578877" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#terminal-arrow)" data-sf-start-node="#terminal-node-chunks" data-sf-end-node="#terminal-node-embed" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="terminal-edge-embed-index" points="860,306.0 900,306.0" fill="none" stroke="#578877" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#terminal-arrow)" data-sf-start-node="#terminal-node-embed" data-sf-end-node="#terminal-node-index" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
