<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Georgia, Songti SC, serif">
<title>纸本编辑 · RAG 架构图</title>
<desc>设计 Prompt 见 src/examples/prompts/editorial.md。原生可编辑 SVG，演示结构。</desc>
<defs><marker id="editorial-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#958577"/></marker></defs>
<rect x="0" y="0" width="1200" height="800" fill="#faf7ef" stroke="none" rx="0" stroke-width="1"/>
<text x="60" y="102" fill="#332d27" font-size="48" font-weight="600">让知识进入回答。</text>
<text x="62" y="143" fill="#71675d" font-size="18" font-weight="400">RAG  /  A field guide to retrieval-augmented generation</text>
