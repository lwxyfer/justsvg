<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, PingFang SC, sans-serif" data-visual-style="standard"><title>Three-tier application architecture</title><desc>Example responsibilities and representative calls across three layers</desc><defs><marker id="base-layered-platform-arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#647f9e" /></marker><marker id="base-layered-platform-arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a16207" /></marker><marker id="base-layered-platform-arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#047857" /></marker><marker id="base-layered-platform-arrow-scope" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b" /></marker></defs><rect x="0" y="0" width="1200" height="800" fill="#fff" stroke="none" rx="0" stroke-width="1.4" /><text x="40" y="48" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">Three-tier application architecture</text><text x="40" y="78" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">Example responsibilities and representative calls across three layers</text><path d="M40 106h36" fill="none" stroke="#647f9e" stroke-width="1.8" /><text x="86" y="110" font-size="12" fill="#475569" font-weight="400" text-anchor="start">Sync call</text><path d="M270 106h36" fill="none" stroke="#a16207" stroke-width="1.8" stroke-dasharray="6 4" /><text x="316" y="110" font-size="12" fill="#475569" font-weight="400" text-anchor="start">Async event</text><path d="M500 106h36" fill="none" stroke="#047857" stroke-width="1.8" /><text x="546" y="110" font-size="12" fill="#475569" font-weight="400" text-anchor="start">Data access</text><g id="base-layered-platform-layer-row-0" data-label="Entry points"><rect x="36" y="132" width="1128" height="142" fill="#ffffff" stroke="#93b4ef" rx="8" stroke-width="1.4" /><text x="52" y="161" font-size="15" fill="#1d4ed8" font-weight="600" text-anchor="start">Entry points</text><g id="base-layered-platform-node-web" data-node="true" data-label="Web / App" data-bounds="220 166 280 80"><rect x="220" y="166" width="280" height="80" fill="#eff6ff" stroke="#93b4ef" rx="8" stroke-width="1.4" /><text x="234" y="194" font-size="17" fill="#1d4ed8" font-weight="600" text-anchor="start">Web / App</text><text x="234" y="218" font-size="13" fill="#475569" font-weight="400" text-anchor="start">UI and requests</text></g><g id="base-layered-platform-node-admin" data-node="true" data-label="Admin UI" data-bounds="540 166 280 80"><rect x="540" y="166" width="280" height="80" fill="#eff6ff" stroke="#93b4ef" rx="8" stroke-width="1.4" /><text x="554" y="194" font-size="17" fill="#1d4ed8" font-weight="600" text-anchor="start">Admin UI</text><text x="554" y="218" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Admin access</text></g><g id="base-layered-platform-node-api" data-node="true" data-label="Public API" data-bounds="860 166 280 80"><rect x="860" y="166" width="280" height="80" fill="#eff6ff" stroke="#93b4ef" rx="8" stroke-width="1.4" /><text x="874" y="194" font-size="17" fill="#1d4ed8" font-weight="600" text-anchor="start">Public API</text><text x="874" y="218" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Integrations</text></g></g><g id="base-layered-platform-layer-row-1" data-label="Services"><rect x="36" y="316" width="1128" height="142" fill="#ffffff" stroke="#b8a0e8" rx="8" stroke-width="1.4" /><text x="52" y="345" font-size="15" fill="#6d28d9" font-weight="600" text-anchor="start">Services</text><g id="base-layered-platform-node-identity" data-node="true" data-label="Accounts" data-bounds="220 350 280 80"><rect x="220" y="350" width="280" height="80" fill="#f5f3ff" stroke="#b8a0e8" rx="8" stroke-width="1.4" /><text x="234" y="378" font-size="17" fill="#6d28d9" font-weight="600" text-anchor="start">Accounts</text><text x="234" y="402" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Members and auth</text></g><g id="base-layered-platform-node-orders" data-node="true" data-label="Orders" data-bounds="540 350 280 80"><rect x="540" y="350" width="280" height="80" fill="#f5f3ff" stroke="#b8a0e8" rx="8" stroke-width="1.4" /><text x="554" y="378" font-size="17" fill="#6d28d9" font-weight="600" text-anchor="start">Orders</text><text x="554" y="402" font-size="13" fill="#475569" font-weight="400" text-anchor="start">State and rules</text></g><g id="base-layered-platform-node-workflow" data-node="true" data-label="Workflows" data-bounds="860 350 280 80"><rect x="860" y="350" width="280" height="80" fill="#f5f3ff" stroke="#b8a0e8" rx="8" stroke-width="1.4" /><text x="874" y="378" font-size="17" fill="#6d28d9" font-weight="600" text-anchor="start">Workflows</text><text x="874" y="402" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Tasks and approvals</text></g></g><g id="base-layered-platform-layer-row-2" data-label="Data layer"><rect x="36" y="500" width="1128" height="142" fill="#ffffff" stroke="#80c5ad" rx="8" stroke-width="1.4" /><text x="52" y="529" font-size="15" fill="#047857" font-weight="600" text-anchor="start">Data layer</text><g id="base-layered-platform-node-postgres" data-node="true" data-label="PostgreSQL" data-bounds="220 534 280 80"><rect x="220" y="534" width="280" height="80" fill="#ecfdf5" stroke="#80c5ad" rx="8" stroke-width="1.4" /><text x="234" y="562" font-size="17" fill="#047857" font-weight="600" text-anchor="start">PostgreSQL</text><text x="234" y="586" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Transactions</text></g><g id="base-layered-platform-node-redis" data-node="true" data-label="Redis" data-bounds="540 534 280 80"><rect x="540" y="534" width="280" height="80" fill="#ecfdf5" stroke="#80c5ad" rx="8" stroke-width="1.4" /><text x="554" y="562" font-size="17" fill="#047857" font-weight="600" text-anchor="start">Redis</text><text x="554" y="586" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Sessions and cache</text></g><g id="base-layered-platform-node-objects" data-node="true" data-label="Object storage" data-bounds="860 534 280 80"><rect x="860" y="534" width="280" height="80" fill="#ecfdf5" stroke="#80c5ad" rx="8" stroke-width="1.4" /><text x="874" y="562" font-size="17" fill="#047857" font-weight="600" text-anchor="start">Object storage</text><text x="874" y="586" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Files and attachments</text></g></g><g data-label="web → identity"><polyline id="base-layered-platform-edge-request-0" points="360,250 360,346" fill="none" stroke="#647f9e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-layered-platform-arrow-sync)" data-sf-start-node="#base-layered-platform-node-web" data-sf-end-node="#base-layered-platform-node-identity" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00" /></g><g data-label="identity → postgres"><polyline id="base-layered-platform-edge-data-0" points="360,434 360,530" fill="none" stroke="#047857" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-layered-platform-arrow-data)" data-sf-start-node="#base-layered-platform-node-identity" data-sf-end-node="#base-layered-platform-node-postgres" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00" /></g><g data-label="admin → orders"><polyline id="base-layered-platform-edge-request-1" points="680,250 680,346" fill="none" stroke="#647f9e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-layered-platform-arrow-sync)" data-sf-start-node="#base-layered-platform-node-admin" data-sf-end-node="#base-layered-platform-node-orders" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00" /></g><g data-label="orders → redis"><polyline id="base-layered-platform-edge-data-1" points="680,434 680,530" fill="none" stroke="#047857" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-layered-platform-arrow-data)" data-sf-start-node="#base-layered-platform-node-orders" data-sf-end-node="#base-layered-platform-node-redis" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00" /></g><g data-label="api → workflow"><polyline id="base-layered-platform-edge-request-2" points="1000,250 1000,346" fill="none" stroke="#647f9e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-layered-platform-arrow-sync)" data-sf-start-node="#base-layered-platform-node-api" data-sf-end-node="#base-layered-platform-node-workflow" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00" /></g><g data-label="workflow → objects"><polyline id="base-layered-platform-edge-data-2" points="1000,434 1000,530" fill="none" stroke="#047857" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-layered-platform-arrow-data)" data-sf-start-node="#base-layered-platform-node-workflow" data-sf-end-node="#base-layered-platform-node-objects" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00" /></g><g data-label="orders → postgres"><polyline id="base-layered-platform-edge-order-transaction" points="680,434 680,480 360,480 360,530" fill="none" stroke="#047857" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-layered-platform-arrow-data)" data-sf-start-node="#base-layered-platform-node-orders" data-sf-end-node="#base-layered-platform-node-postgres" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00" /></g><g data-label="identity → redis"><polyline id="base-layered-platform-edge-session" points="504,390 514,390 514,488 680,488 680,530" fill="none" stroke="#047857" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-layered-platform-arrow-data)" data-sf-start-node="#base-layered-platform-node-identity" data-sf-end-node="#base-layered-platform-node-redis" data-sf-start-anchor="1.000000 0.500000 4.00 0.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00" /></g><g data-label="Shared services"><rect x="36" y="694" width="1128" height="70" fill="#f8fafc" stroke="#dce4ee" rx="8" stroke-width="1.4" /><text x="56" y="723" font-size="15" fill="#334155" font-weight="600" text-anchor="start">Shared services</text><text x="220" y="723" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Config and secrets  ·  Logs / metrics / traces  ·  CI/CD and rollback</text><text x="220" y="747" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Illustrative responsibilities; choose service boundaries and deployment for your constraints.</text></g></svg>