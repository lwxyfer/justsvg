<polyline id="terminal-edge-context-llm" points="680,606.0 750,606.0" fill="none" stroke="#578877" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#terminal-arrow)" data-sf-start-node="#terminal-node-context" data-sf-end-node="#terminal-node-llm" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
