>完成发布</text><text x="204" y="626" font-size="13" fill="#b7c8dd" font-weight="400" text-anchor="start">扩大流量 · 记录变更</text></g><g id="base-night-release-flow-node-rollback" data-node="true" data-label="回滚恢复"><rect x="790" y="780" width="180" height="72" fill="#372f20" stroke="#9d824c" rx="4" stroke-width="1.2"/><text x="804" y="808" font-size="17" fill="#f2d595" font-weight="600" text-anchor="start">回滚恢复</text><text x="804" y="832" font-size="13" fill="#b7c8dd" font-weight="400" text-anchor="start">恢复上个稳定版本</text></g></g><g data-label="commit → review"><polyline id="base-night-release-flow-edge-commit-review" points="374,208 486,208" fill="none" stroke="#92b4dc" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-night-release-flow-arrow-sync)" data-sf-start-node="#base-night-release-flow-node-commit" data-sf-end-node="#base-night-release-flow-node-review" data-sf-start-anchor="1.000000 0.500000 4.00 0.00" data-sf-end-anchor="0.000000 0.500000 -4.00 0.00"/></g><g data-label="review → merge"><polyline id="base-night-release-flow-edge-review-merge" points="674,208 786,208" fill="none" stroke="#92b4dc" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-night-release-flow-arrow-sync)" data-sf-start-node="#base-night-release-flow-node-review" data-sf-end-node="#base-night-release-flow-node-merge" data-sf-start-anchor="1.000000 0.500000 4.00 0.00" data-sf-end-anchor="0.000000 0.500000 -4.00 0.00"/></g><g data-label="merge → build"><polyline id="base-night-release-flow-edge-merge-build" points="880,248 880,372" fill="none" stroke="#92b4dc" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#base-night-release-flow-arrow-sync)" data-sf-start-node="#base-night-release-flow-node-merge" data-sf-end-node="#base-night-release-flow-node-build" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00"/></g><g data-label="build → checks"><polyline id="base-night-release-flow-edge-build-check" points="974,412