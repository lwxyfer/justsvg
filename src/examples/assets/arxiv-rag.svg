<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Times New Roman, Times, Liberation Serif, serif" fill="#20242b">
  <title>arXiv 论文配图 · Retrieval-augmented generation</title>
  <desc>Original illustrative methods figure: offline indexing, online retrieval and generation, and an evidence-packed prompt inset. Not an official arXiv template or an experimental result. All text and nodes are editable.</desc>
  <defs>
    <marker id="arxiv-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 4L0 8Z" fill="#414853"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#ffffff"/>
  <text x="28" y="35" font-size="28" font-weight="700">Retrieval-augmented generation</text>
  <text x="1412" y="33" text-anchor="end" font-size="18" font-style="italic" fill="#515b69">An illustrative methods figure</text>

  <g id="arxiv-panel-indexing" data-label="(a) Offline indexing">
    <rect x="28" y="58" width="1384" height="210" rx="5" fill="#f8fafc" stroke="#a8afb9" stroke-width="1.3"/>
    <text x="48" y="91" font-size="23"><tspan font-weight="700">(a)</tspan><tspan dx="9">Offline indexing</tspan></text>
    <text x="1388" y="90" text-anchor="end" font-size="18" font-style="italic" fill="#515b69">Construct once; refresh when the corpus changes</text>
  </g>
  <g id="arxiv-panel-inference" data-label="(b) Online retrieval and generation">
    <rect x="28" y="286" width="1384" height="300" rx="5" fill="#ffffff" stroke="#a8afb9" stroke-width="1.3"/>
    <text x="48" y="320" font-size="23"><tspan font-weight="700">(b)</tspan><tspan dx="9">Online retrieval and generation</tspan></text>
    <text x="1388" y="565" text-anchor="end" font-size="18" font-style="italic" fill="#515b69">Condition the decoder on retrieved evidence</text>
  </g>

  <g id="arxiv-connections" data-label="Data flow" fill="none" stroke="#414853" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arxiv-arrow)">
    <polyline id="arxiv-edge-docs-chunks" points="280,185 340,185" data-sf-start-node="#arxiv-node-docs" data-sf-end-node="#arxiv-node-chunks" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
    <polyline id="arxiv-edge-chunks-embed" points="570,185 630,185" data-sf-start-node="#arxiv-node-chunks" data-sf-end-node="#arxiv-node-embed" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
    <polyline id="arxiv-edge-embed-index" points="880,185 990,185" data-sf-start-node="#arxiv-node-embed" data-sf-end-node="#arxiv-node-index" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
    <polyline id="arxiv-edge-index-retrieve" points="1165,238 1165,358 425,358 425,406" stroke-dasharray="7 5" data-sf-start-node="#arxiv-node-index" data-sf-end-node="#arxiv-node-retrieve" data-sf-start-anchor=".5 1 0 0" data-sf-end-anchor=".5 0 0 0"/>
    <polyline id="arxiv-edge-query-retrieve" points="250,461 330,461" data-sf-start-node="#arxiv-node-query" data-sf-end-node="#arxiv-node-retrieve" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
    <polyline id="arxiv-edge-retrieve-context" points="520,461 600,461" data-sf-start-node="#arxiv-node-retrieve" data-sf-end-node="#arxiv-node-context" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
    <polyline id="arxiv-edge-context-llm" points="800,461 880,461" data-sf-start-node="#arxiv-node-context" data-sf-end-node="#arxiv-node-llm" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
    <polyline id="arxiv-edge-llm-answer" points="1080,461 1160,461" data-sf-start-node="#arxiv-node-llm" data-sf-end-node="#arxiv-node-answer" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
  </g>

  <g id="arxiv-node-docs" data-node="true" data-label="Documents · Source corpus">
    <rect x="64" y="132" width="216" height="106" rx="3" fill="#ffffff" stroke="#687383" stroke-width="1.5"/>
    <path d="M85 155H105L113 163V190H85ZM105 155V163H113M91 171H107M91 178H107M91 185H101" fill="none" stroke="#687383" stroke-width="1.3"/>
    <text x="184" y="171" text-anchor="middle" font-size="24" font-weight="700">Documents</text>
    <text x="184" y="207" text-anchor="middle" font-size="23" font-style="italic">D = {d₁, …, dₙ}</text>
  </g>
  <g id="arxiv-node-chunks" data-node="true" data-label="Chunking · Passage segmentation">
    <rect x="340" y="132" width="230" height="106" rx="3" fill="#ffffff" stroke="#687383" stroke-width="1.5"/>
    <text x="455" y="169" text-anchor="middle" font-size="24" font-weight="700">Chunking</text>
    <g fill="#e4e8ee" stroke="#687383" stroke-width="1"><rect x="371" y="190" width="48" height="22" rx="1"/><rect x="431" y="190" width="48" height="22" rx="1"/><rect x="491" y="190" width="48" height="22" rx="1"/></g>
    <text x="395" y="207" text-anchor="middle" font-size="17" font-style="italic">c₁</text><text x="455" y="207" text-anchor="middle" font-size="17" font-style="italic">c₂</text><text x="515" y="207" text-anchor="middle" font-size="17" font-style="italic">cₙ</text>
  </g>
  <g id="arxiv-node-embed" data-node="true" data-label="Embeddings · Passage encoder">
    <rect x="630" y="132" width="250" height="106" rx="3" fill="#e8f0fa" stroke="#4b6c92" stroke-width="1.5"/>
    <text x="755" y="169" text-anchor="middle" font-size="24" font-weight="700">Embeddings</text>
    <text x="755" y="207" text-anchor="middle" font-size="23" font-style="italic">eᵢ = E(cᵢ)</text>
  </g>
  <g id="arxiv-node-index" data-node="true" data-label="Vector index · Indexed corpus">
    <rect x="990" y="132" width="350" height="106" rx="3" fill="#e8f0fa" stroke="#4b6c92" stroke-width="1.5"/>
    <text x="1092" y="169" text-anchor="middle" font-size="24" font-weight="700">Vector index</text>
    <text x="1092" y="207" text-anchor="middle" font-size="23" font-style="italic">V = {e₁, …, eₙ}</text>
    <g stroke="#4b6c92" stroke-width="1">
      <path d="M1202 151H1309M1202 169H1309M1202 187H1309M1202 205H1309M1202 151V205M1229 151V205M1256 151V205M1283 151V205M1309 151V205" fill="none"/>
      <rect x="1230" y="152" width="25" height="16" fill="#b0c8e2"/><rect x="1284" y="170" width="24" height="16" fill="#6f94bd"/><rect x="1203" y="188" width="25" height="16" fill="#b0c8e2"/>
    </g>
  </g>

  <g id="arxiv-edge-labels" data-label="Flow annotations" font-size="18" fill="#414853" text-anchor="middle">
    <text x="935" y="170" font-style="italic">index</text>
    <text x="807" y="347">indexed corpus (read-only lookup)</text>
    <text x="290" y="445" font-style="italic">E(q)</text>
    <text x="560" y="445" font-style="italic">top-k</text>
    <text x="840" y="445" font-style="italic">P(q, C)</text>
    <text x="1120" y="445" font-style="italic">decode</text>
  </g>
  <g id="arxiv-node-query" data-node="true" data-label="User query">
    <rect x="64" y="406" width="186" height="110" rx="3" fill="#ffffff" stroke="#687383" stroke-width="1.5"/>
    <text x="157" y="447" text-anchor="middle" font-size="24" font-weight="700">User query</text>
    <text x="157" y="489" text-anchor="middle" font-size="27" font-style="italic">q</text>
  </g>
  <g id="arxiv-node-retrieve" data-node="true" data-label="Retriever · Similarity search">
    <rect x="330" y="406" width="190" height="110" rx="3" fill="#e8f0fa" stroke="#4b6c92" stroke-width="1.5"/>
    <text x="425" y="447" text-anchor="middle" font-size="24" font-weight="700">Retriever</text>
    <text x="425" y="486" text-anchor="middle" font-size="20" font-style="italic">sim(E(q), eᵢ)</text>
  </g>
  <g id="arxiv-node-context" data-node="true" data-label="Context · Selected evidence">
    <rect x="600" y="406" width="200" height="110" rx="3" fill="#fbefd9" stroke="#967235" stroke-width="1.5"/>
    <text x="700" y="447" text-anchor="middle" font-size="24" font-weight="700">Context</text>
    <text x="700" y="486" text-anchor="middle" font-size="23" font-style="italic">C = {c₁, …, cₖ}</text>
  </g>
  <g id="arxiv-node-llm" data-node="true" data-label="LLM · Conditional generation">
    <rect x="880" y="406" width="200" height="110" rx="3" fill="#eee9f6" stroke="#7d6b98" stroke-width="1.5"/>
    <text x="980" y="447" text-anchor="middle" font-size="24" font-weight="700">LLM</text>
    <text x="980" y="486" text-anchor="middle" font-size="23" font-style="italic">p<tspan baseline-shift="sub" font-size="16">θ</tspan><tspan baseline-shift="baseline" font-size="23">(y | q, C)</tspan></text>
  </g>
  <g id="arxiv-node-answer" data-node="true" data-label="Answer · Generated response with citations">
    <rect x="1160" y="406" width="216" height="110" rx="3" fill="#ffffff" stroke="#687383" stroke-width="1.5"/>
    <text x="1268" y="447" text-anchor="middle" font-size="24" font-weight="700">Answer</text>
    <text x="1268" y="486" text-anchor="middle" font-size="23" font-style="italic">ŷ + citations</text>
  </g>

  <path d="M700 516V624" fill="none" stroke="#967235" stroke-width="1.2" stroke-dasharray="3 4"/>
  <g id="arxiv-prompt-inset" data-label="(c) Prompt detail · Editable inset">
    <rect x="28" y="624" width="810" height="170" rx="3" fill="#fffdfa" stroke="#967235" stroke-width="1.3"/>
    <text x="48" y="656" font-size="23"><tspan font-weight="700">(c)</tspan><tspan dx="9">Evidence-packed prompt</tspan></text>
    <line x1="48" y1="672" x2="818" y2="672" stroke="#d7c8af" stroke-width="1"/>
    <text x="50" y="701" font-size="20" font-style="italic">q</text><text x="120" y="701" font-size="19">Answer the question using the passages below.</text>
    <text x="50" y="735" font-size="20" font-style="italic">c₁</text><text x="120" y="735" font-size="19">[1] Retrieved passage …</text>
    <text x="50" y="768" font-size="20" font-style="italic">cₖ</text><text x="120" y="768" font-size="19">[k] Retrieved passage …</text>
    <path d="M91 686H99V775H91" stroke="#967235" stroke-width="1.2" fill="none"/>
  </g>
  <g id="arxiv-decoding-note" data-label="Conditional decoding equation and legend">
    <text x="884" y="653" font-size="22" font-weight="700">Conditional decoding</text>
    <text x="884" y="699" font-size="26" font-style="italic">ŷ = <tspan font-style="normal">arg max</tspan><tspan baseline-shift="sub" font-size="17">y</tspan><tspan baseline-shift="baseline" font-size="26"> p</tspan><tspan baseline-shift="sub" font-size="17">θ</tspan><tspan baseline-shift="baseline" font-size="26">(y | q, C)</tspan></text>
    <text x="884" y="732" font-size="18" fill="#515b69">C: retrieved passages; θ: decoder parameters.</text>
    <line x1="884" y1="769" x2="932" y2="769" stroke="#414853" stroke-width="1.8" marker-end="url(#arxiv-arrow)"/>
    <text x="945" y="775" font-size="18">data flow</text>
    <line x1="1084" y1="769" x2="1132" y2="769" stroke="#414853" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arxiv-arrow)"/>
    <text x="1145" y="775" font-size="18">index lookup</text>
  </g>
  <text x="28" y="840" font-size="23"><tspan font-weight="700">Figure 1.</tspan><tspan dx="8">Overview of a retrieval-augmented generation pipeline.</tspan></text>
  <text x="28" y="871" font-size="19">(a) Encode and index a document corpus. (b) Retrieve evidence and generate an answer. (c) Expand the prompt structure.</text>
</svg>
