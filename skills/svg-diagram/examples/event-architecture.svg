<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">An order becomes an event.</title><desc id="diagram-desc">事件驱动订单架构 · 一次请求，多路处理</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#351825" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="warm" x2="1" y2="0"><stop stop-color="#ffd7a4"/><stop offset=".5" stop-color="#ee795d"/><stop offset="1" stop-color="#f6a6ae"/></linearGradient>
