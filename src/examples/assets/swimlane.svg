<text x="932" y="299" font-size="22" fill="#253b55" font-weight="600" text-anchor="start">Vector index</text>
<text x="932" y="331" font-size="14" fill="#516781" font-weight="400" text-anchor="start">向量索引</text></g>
<g id="swimlane-node-query" data-label="User query / 用户问题" data-node="true"><rect x="150" y="550" width="170" height="112" fill="#ffffff" stroke="#607e9f" rx="0" stroke-width="1"/>
