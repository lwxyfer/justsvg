<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, PingFang SC, sans-serif" data-visual-style="wire"><title>三层业务系统 · 基础架构</title><desc>基础分层演变 · 访问端、业务服务与数据职责，选取代表性调用</desc><defs><marker id="base-wire-layered-platform-arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#465361"/></marker><marker id="base-wire-layered-platform-arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#465361"/></marker><marker id="base-wire-layered-platform-arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#465361"/></marker><marker id="base-wire-layered-platform-arrow-scope" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#586573"/></marker></defs><rect x="0" y="0" width="1200" height="800" fill="#fff" stroke="none" rx="0" stroke-width="1.2"/><text x="40" y="48" font-size="28" fill="#182331" font-weight="700" text-anchor="start">三层业务系统 · 基础架构</text><text x="40" y="78" font-size="13" fill="#586573" font-weight="400" text-anchor="start">基础分层演变 · 访问端、业务服务与数据职责，选取代表性调用</text><path d="M40 106h36" fill="none" stroke="#465361" stroke-width="1.4"/><text x="86" y="110" font-size="12" fill="#3b4653" font-weight="400" text-anchor="start">同步调用</text><path d="M270 106h36" fill="none" stroke="#465361" stroke-width="1.4" stroke-dasharray="6 4"/><text x="316" y="110" font-size="12" fill="#3b4653" font-weight="400" text-anchor="start">异步事件</text><path d="M500 106h36" fill="none" stroke="#465361" stroke-width="2.2"/><text x="546" y="110" font-size="12" fill="#3b4653" font-weight="400" text-anchor="start">数据访问</text><g id="base-wire-layered-platform-layer-row-0" data-label="访问入口"><rect x="36" y="132" width="1128" height="142" fill="#ffffff" stroke="#657181" rx="0" stroke-width="1.2" stroke-dasharray="7 5"/><text x="52" y="161" font-size="15" fill="#182331" font-weight="600" text-anchor="start">访问入口</text><g id="base-wire-layered-platform-node-web" data-node="true" data-label="Web / App"><rect x="220" y="166" width="280" height="80" fill="#ffffff" stroke="#657181" rx="0" stroke-width="1.2"/><text x="234" y="194" font-size="17" fill="#182331" font-weight="600" text-anchor="start">Web / App</text><text x="234" y="218" font-size="13" fill="#3b4653" font-weight="400" text-anchor="start">页面交互 · 客户请求</text></g><g id="base-wire-layered-platform-node-admin" data-node="true" data-label="管理后台"><rect x="540" y="166" width="280" height="80" fill="#ffffff" stroke="#657181" rx="0" stroke-width="1.2"/><text x="554" y="194" font-size="17" fill="#182331" font-weight="600" text-anchor="start">管理后台</text><text x="554" y="218" font-size="13" fill="#3b4653" font-weight="400" text-anchor="start">运营操作 · 权限入口</text></g><g id="base-wire-layered-platform-node-api" data-node="true" data-label="开放 API"><rect x="860" y="166" width="280" height="80" fill="#ffffff" stroke="#657181" rx="0" stroke-width="1.2"/><text x="874" y="194" font-size="17" fill="#182331" font-weight="600" text-anchor="start">开放 API</text><text x="874" y="218" font-size="13" fill="#3b4653" font-weight="400" text-anchor="start">外部集成 · 接口访问</text></g></g><g id="base-wire-layered-platform-layer-row-1" data-label="业务服务"><rect x="36" y="316" width="1128" height="142" fill="#ffffff" stroke="#657181" rx="0" stroke-width="1.2" stroke-dasharray="7 5"/><text x="52" y="345" font-size="15" fill="#182331" font-weight="600" text-anchor="start">业务服务</text><g id="base-wire-layered-platform-node-identity" data-node="true" data-label="账户服务"><rect x="220" y="350" width="280" height="80" fill="#ffffff" stroke="#657181" rx="0" stroke-width="1.2"/><text x="234" y="378" font-size="17" fill="#182331" font-weight="600" text-anchor="start">账户服务</text><text x="234" y="402" font-size="13" fill="#3b4653" font-weight="400" text-anchor="start">组织与成员 · 鉴权</text></g><g id="base-wire-layered-platform-node-orders" data-node="true" data-label="订单服务"><rect x="540" y="350" width="280" height="80" fill="#ffffff" stroke="#657181" rx="0" stroke-width="1.2"/><text x="554" y="378" font-size="17" fill="#182331" font-weight="600" text-anchor="start">订单服务</text><text x="554" y="402" font-size="13" fill="#3b4653" font-weight="400" text-anchor="start">订单状态 · 交易规则</text></g><g id="base-wire-layered-platform-node-workflow" data-node="true" data-label="流程服务"><rect x="860" y="350" width="280" height="80" fill="#ffffff" stroke="#657181" rx="0" stroke-width="1.2"/><text x="874" y="378" font-size="17" fill="#182331" font-weight="600" text-anchor="start">流程服务</text><text x="874" y="402" font-size="13" fill="#3b4653" font-weight="400" text-anchor="start">任务编排 · 审批</text></g></g><g id="base-wire-layered-platform-layer-row-2" data-label="数据支撑"><rect x="36" y="500" width="1128" height="142" fill="#ffffff" stroke="#657181" rx="0" stroke-width="1.2" stroke-dasharray="7 5"/><text x="52" y="529" font-size="15" fill="#182331" font-weight="600" text-anchor="start">数据支撑</text><g id="base-wire-layered-platform-node-postgres" data-node="true" data-label="PostgreSQL"><rect x="220" y="534" width="280" height="80" fill="#ffffff" stroke="#657181" rx="0" stroke-width="1.2"/><text x="234" y="562" font-size="17" fill="#182331" font-weight="600" text-anchor="start">PostgreSQL</text><text x="234" y="586" font-size="13" fill="#3b4653" font-weight="400" text-anchor="start">事务与持久化</text></g><g id="base-wire-layered-platform-node-redis" data-node="true" data-label="Redis"><rect x="540" y="534" width="280" height="80" fill="#ffffff" stroke="#657181" rx="0" stroke-width="1.2"/><text x="554" y="562" font-size="17" fill="#182331" font-weight="600" text-anchor="start">Redis</text><text x="554" y="586" font-size="13" fill="#3b4653" font-weight="400" text-anchor="start">会话与热点缓存</text></g><g id="base-wire-layered-platform-node-objects" data-node="true" data-label="对象存储"><rect x="860" y="534" width="280" height="80" fill="#ffffff" stroke="#657181" rx="0" stroke-width="1.2"/><text x="874" y="562" font-size="17" fill="#182331" font-weight="600" text-anchor="start">对象存储</text><text x="874" y="586" font-size="13" fill="#3b4653" font-weight="400" text-anchor="start">文件与业务附件</text></g></g><g data-label="web → identity"><polyline id="base-wire-layered-platform-edge-request-0" points="360,250 360,346" fill="none" stroke="#465361" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#base-wire-layered-platform-arrow-sync)" data-sf-start-node="#base-wire-layered-platform-node-web" data-sf-end-node="#base-wire-layered-platform-node-identity" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00"/></g><g data-label="identity → postgres"><polyline id="base-wire-layered-platform-edge-data-0" points="360,434 360,530" fill="none" stroke="#465361" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#base-wire-layered-platform-arrow-data)" data-sf-start-node="#base-wire-layered-platform-node-identity" data-sf-end-node="#base-wire-layered-platform-node-postgres" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00"/></g><g data-label="admin → orders"><polyline id="base-wire-layered-platform-edge-request-1" points="680,250 680,346" fill="none" stroke="#465361" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#base-wire-layered-platform-arrow-sync)" data-sf-start-node="#base-wire-layered-platform-node-admin" data-sf-end-node="#base-wire-layered-platform-node-orders" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00"/></g><g data-label="orders → redis"><polyline id="base-wire-layered-platform-edge-data-1" points="680,434 680,530" fill="none" stroke="#465361" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#base-wire-layered-platform-arrow-data)" data-sf-start-node="#base-wire-layered-platform-node-orders" data-sf-end-node="#base-wire-layered-platform-node-redis" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00"/></g><g data-label="api → workflow"><polyline id="base-wire-layered-platform-edge-request-2" points="1000,250 1000,346" fill="none" stroke="#465361" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#base-wire-layered-platform-arrow-sync)" data-sf-start-node="#base-wire-layered-platform-node-api" data-sf-end-node="#base-wire-layered-platform-node-workflow" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00"/></g><g data-label="workflow → objects"><polyline id="base-wire-layered-platform-edge-data-2" points="1000,434 1000,530" fill="none" stroke="#465361" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#base-wire-layered-platform-arrow-data)" data-sf-start-node="#base-wire-layered-platform-node-workflow" data-sf-end-node="#base-wire-layered-platform-node-objects" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00"/></g><g data-label="orders → postgres"><polyline id="base-wire-layered-platform-edge-order-transaction" points="680,434 680,480 360,480 360,530" fill="none" stroke="#465361" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#base-wire-layered-platform-arrow-data)" data-sf-start-node="#base-wire-layered-platform-node-orders" data-sf-end-node="#base-wire-layered-platform-node-postgres" data-sf-start-anchor="0.500000 1.000000 0.00 4.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00"/></g><g data-label="identity → redis"><polyline id="base-wire-layered-platform-edge-session" points="504,390 514,390 514,488 680,488 680,530" fill="none" stroke="#465361" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#base-wire-layered-platform-arrow-data)" data-sf-start-node="#base-wire-layered-platform-node-identity" data-sf-end-node="#base-wire-layered-platform-node-redis" data-sf-start-anchor="1.000000 0.500000 4.00 0.00" data-sf-end-anchor="0.500000 0.000000 0.00 -4.00"/></g><g data-label="共享支撑"><rect x="36" y="694" width="1128" height="70" fill="#ffffff" stroke="#a9b2be" rx="0" stroke-width="1.2"/><text x="56" y="723" font-size="15" fill="#263442" font-weight="600" text-anchor="start">共享支撑</text><text x="220" y="723" font-size="14" fill="#3b4653" font-weight="400" text-anchor="start">配置与密钥  ·  日志 / 指标 / 链路  ·  CI/CD 与回滚</text><text x="220" y="747" font-size="12" fill="#586573" font-weight="400" text-anchor="start">图示为职责划分示例，服务拆分和部署方式按实际约束确定。</text></g></svg>
