<text x="682" y="331" font-size="14" fill="#516781" font-weight="400" text-anchor="start">向量编码</text></g>
<g id="swimlane-node-index" data-label="Vector index / 向量索引" data-node="true"><rect x="920" y="250" width="210" height="112" fill="#ffffff" stroke="#607e9f" rx="0" stroke-width="1"/>
