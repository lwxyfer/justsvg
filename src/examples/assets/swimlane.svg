<polyline id="swimlane-edge-context-llm" points="730,606.0 765,606.0" fill="none" stroke="#607e9f" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#swimlane-arrow-main)" data-sf-start-node="#swimlane-node-context" data-sf-end-node="#swimlane-node-llm" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="swimlane-edge-llm-answer" points="935,606.0 970,606.0" fill="none" stroke="#607e9f" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#swimlane-arrow-main)" data-sf-start-node="#swimlane-node-llm" data-sf-end-node="#swimlane-node-answer" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="swimlane-edge-index-retrieve" points="1025.0,362 1025.0,440 440.0,440 440.0,550" fill="none" stroke="#607e9f" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#swimlane-arrow-main)" data-sf-start-node="#swimlane-node-index" data-sf-end-node="#swimlane-node-retrieve" data-sf-start-anchor=".5 1 0 0" data-sf-end-anchor=".5 0 0 0" stroke-dasharray="6 4"/></g>
<g id="swimlane-node-docs" data-label="Documents / 文档与知识库" data-node="true"><rect x="170" y="250" width="210" height="112" fill="#ffffff" stroke="#607e9f" rx="0" stroke-width="1"/>
