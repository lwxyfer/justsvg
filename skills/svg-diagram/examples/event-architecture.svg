" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.2"/><path d="M1014 760A146 146 0 0 1 1160 614" fill="none" stroke="#fff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.18"/><path d="M239 160A199 199 0 0 1 40 359" fill="none" stroke="#fff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.2"/><path d="M1002 760A158 158 0 0 1 1160 602" fill="none" stroke="#fff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.18"/><path d="M250 160A210 210 0 0 1 40 370" fill="none" stroke="#fff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.2"/><path d="M990 760A170 170 0 0 1 1160 590" fill="none" stroke="#fff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.18"/><path d="M261 160A221 221 0 0 1 40 381" fill="none" stroke="#fff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.2"/><path d="M978 760A182 182 0 0 1 1160 578" fill="none" stroke="#fff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.18"/><path d="M272 160A232 232 0 0 1 40 392" fill="none" stroke="#fff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.2"/><path d="M966 760A194 194 0 0 1 1160 566" fill="none" stroke="#fff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.18"/></g>
