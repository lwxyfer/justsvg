<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Arial, PingFang SC, sans-serif" data-workplace="lineage"><title>数据平台 · 批流与血缘</title><desc>多源采集、原始层、清洗层和消费层；区分实时与离线链路。示意数据，非生产配置。</desc><defs><marker id="work-reference-lineage-arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#6b7178"/></marker><marker id="work-reference-lineage-crow" viewBox="0 0 12 12" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12 0L0 6L12 12M0 6H12" stroke="#6b7178" fill="none"/></marker></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#fdfdfd" stroke="none" stroke-width="2"/><text x="56" y="66" font-size="36" fill="#292b2f" font-weight="700" >数据平台 · 批流与血缘</text><text x="56" y="106" font-size="19" fill="#6b7178" font-weight="400" >多源采集、原始层、清洗层和消费层；区分实时与离线链路</text><rect x="48" y="164" width="352" height="708" rx="8" fill="#f3f6fd" stroke="#2451c4" stroke-width="2"/><text x="68" y="197" font-size="21" fill="#292b2f" font-weight="600" >数据源</text><rect x="436" y="164" width="352" height="708" rx="8" fill="#f8f5fe" stroke="#6d28d9" stroke-width="2"/><text x="456" y="197" font-size="21" fill="#292b2f" font-weight="600" >采集与原始层</text><rect x="824" y="164" width="352" height="708" rx="8" fill="#effaf6" stroke="#14786b" stroke-width="2"/><text x="844" y="197" font-size="21" fill="#292b2f" font-weight="600" >清洗与建模</text><rect x="1212" y="164" width="352" height="708" rx="8" fill="#fef6f3" stroke="#80600c" stroke-width="2"/><text x="1232" y="197" font-size="21" fill="#292b2f" font-weight="600" >消费</text><polyline id="work-reference-lineage-edge-0" points="380,340 456,340" fill="none" stroke="#6b7178" stroke-width="2" marker-end="url(#work-reference-lineage-arrow)" data-sf-start-node="#work-reference-lineage-db" data-sf-end-node="#work-reference-lineage-raw" data-sf-start-anchor="1 0.5 4 0" data-sf-end-anchor="0 0.5 -4 0"/><polyline id="work-reference-lineage-edge-1" points="768,340 844,340" fill="none" stroke="#6b7178" stroke-width="2" marker-end="url(#work-reference-lineage-arrow)" data-sf-start-node="#work-reference-lineage-raw" data-sf-end-node="#work-reference-lineage-warehouse" data-sf-start-anchor="1 0.5 4 0" data-sf-end-anchor="0 0.5 -4 0"/><polyline id="work-reference-lineage-edge-2" points="1156,340 1232,340" fill="none" stroke="#6b7178" stroke-width="2" marker-end="url(#work-reference-lineage-arrow)" data-sf-start-node="#work-reference-lineage-warehouse" data-sf-end-node="#work-reference-lineage-bi" data-sf-start-anchor="1 0.5 4 0" data-sf-end-anchor="0 0.5 -4 0"/><polyline id="work-reference-lineage-edge-3" points="380,680 456,680" fill="none" stroke="#6b7178" stroke-width="2" marker-end="url(#work-reference-lineage-arrow)" data-sf-start-node="#work-reference-lineage-events" data-sf-end-node="#work-reference-lineage-stream" data-sf-start-anchor="1 0.5 4 0" data-sf-end-anchor="0 0.5 -4 0"/><polyline id="work-reference-lineage-edge-4" points="768,680 844,680" fill="none" stroke="#6b7178" stroke-width="2" marker-end="url(#work-reference-lineage-arrow)" data-sf-start-node="#work-reference-lineage-stream" data-sf-end-node="#work-reference-lineage-realtime" data-sf-start-anchor="1 0.5 4 0" data-sf-end-anchor="0 0.5 -4 0"/><polyline id="work-reference-lineage-edge-5" points="1156,680 1232,680" fill="none" stroke="#6b7178" stroke-width="2" marker-end="url(#work-reference-lineage-arrow)" data-sf-start-node="#work-reference-lineage-realtime" data-sf-end-node="#work-reference-lineage-api" data-sf-start-anchor="1 0.5 4 0" data-sf-end-anchor="0 0.5 -4 0"/><g id="work-reference-lineage-db" data-node="true" data-label="业务数据库" data-layout="72 280 304 120"><rect x="72" y="280" width="304" height="120" rx="8" fill="#e5ecfc" stroke="#2451c4" stroke-width="2"/><text x="224" y="314" font-size="23" fill="#292b2f" font-weight="700" text-anchor="middle">业务数据库</text><text x="224" y="346" font-size="18" fill="#45484d" font-weight="400" text-anchor="middle">订单 / 商品</text></g><g id="work-reference-lineage-events" data-node="true" data-label="行为事件" data-layout="72 620 304 120"><rect x="72" y="620" width="304" height="120" rx="8" fill="#e5ecfc" stroke="#2451c4" stroke-width="2"/><text x="224" y="654" font-size="23" fill="#292b2f" font-weight="700" text-anchor="middle">行为事件</text><text x="224" y="686" font-size="18" fill="#45484d" font-weight="400" text-anchor="middle">埋点 / 日志</text></g><g id="work-reference-lineage-raw" data-node="true" data-label="ODS 原始层" data-layout="460 280 304 120"><rect x="460" y="280" width="304" height="120" rx="8" fill="#edeafd" stroke="#6d28d9" stroke-width="2"/><text x="612" y="314" font-size="23" fill="#292b2f" font-weight="700" text-anchor="middle">ODS 原始层</text><text x="612" y="346" font-size="18" fill="#45484d" font-weight="400" text-anchor="middle">批同步 / 原始快照</text></g><g id="work-reference-lineage-stream" data-node="true" data-label="事件流" data-layout="460 620 304 120"><rect x="460" y="620" width="304" height="120" rx="8" fill="#edeafd" stroke="#6d28d9" stroke-width="2"/><text x="612" y="654" font-size="23" fill="#292b2f" font-weight="700" text-anchor="middle">事件流</text><text x="612" y="686" font-size="18" fill="#45484d" font-weight="400" text-anchor="middle">实时采集 / 分区</text></g><g id="work-reference-lineage-warehouse" data-node="true" data-label="DWD 明细层" data-layout="848 280 304 120"><rect x="848" y="280" width="304" height="120" rx="8" fill="#d2f5ee" stroke="#14786b" stroke-width="2"/><text x="1000" y="314" font-size="23" fill="#292b2f" font-weight="700" text-anchor="middle">DWD 明细层</text><text x="1000" y="346" font-size="18" fill="#45484d" font-weight="400" text-anchor="middle">清洗 / 去重 / 统一键</text></g><g id="work-reference-lineage-realtime" data-node="true" data-label="实时聚合" data-layout="848 620 304 120"><rect x="848" y="620" width="304" height="120" rx="8" fill="#d2f5ee" stroke="#14786b" stroke-width="2"/><text x="1000" y="654" font-size="23" fill="#292b2f" font-weight="700" text-anchor="middle">实时聚合</text><text x="1000" y="686" font-size="18" fill="#45484d" font-weight="400" text-anchor="middle">窗口统计 / 延迟水位</text></g><g id="work-reference-lineage-bi" data-node="true" data-label="经营分析" data-layout="1236 280 292 120"><rect x="1236" y="280" width="292" height="120" rx="8" fill="#fbead0" stroke="#80600c" stroke-width="2"/><text x="1382" y="314" font-size="23" fill="#292b2f" font-weight="700" text-anchor="middle">经营分析</text><text x="1382" y="346" font-size="18" fill="#45484d" font-weight="400" text-anchor="middle">主题指标 / 报表</text></g><g id="work-reference-lineage-api" data-node="true" data-label="在线服务" data-layout="1236 620 292 120"><rect x="1236" y="620" width="292" height="120" rx="8" fill="#fbead0" stroke="#80600c" stroke-width="2"/><text x="1382" y="654" font-size="23" fill="#292b2f" font-weight="700" text-anchor="middle">在线服务</text><text x="1382" y="686" font-size="18" fill="#45484d" font-weight="400" text-anchor="middle">实时特征 / 查询 API</text></g><text x="72" y="930" font-size="18" fill="#6b7178" font-weight="400" >上行离线批处理，下行实时处理；同名业务键用于关联，未表示实际处理吞吐或延迟。</text><text x="56" y="970" font-size="16" fill="#6b7178" font-weight="400" >工作场景示例 · 数据与部署均为演示 · 原生文字 / 分组 / 关联线可编辑</text></svg>
