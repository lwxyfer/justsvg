<text x="552" y="342" font-size="18" fill="#f4f5f8" font-weight="600" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Build &amp; test</text>
<text x="552" y="361" font-size="13" fill="#b0afb4" font-weight="400" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Static + behavior checks</text>
