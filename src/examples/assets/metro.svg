<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Arial, PingFang SC, sans-serif">
<title>地铁线路 · RAG 架构图</title>
<desc>原生可编辑示例。设计 Prompt 见 src/examples/prompts/metro.md。演示架构，非生产配置。</desc>
<defs><marker id="metro-arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245ea8"/></marker><marker id="metro-arrow-online" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#287b65"/></marker><marker id="metro-arrow-cross" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#576674"/></marker></defs>
<rect x="0" y="0" width="1200" height="800" fill="#fcfcfa" stroke="none" rx="0" stroke-width="1"/>
<text x="60" y="100" font-size="44" fill="#263441" font-weight="500" text-anchor="start">知识有自己的线路</text>
<text x="60" y="143" font-size="16" fill="#576674" font-weight="400" text-anchor="start">RAG 路线图 · 两条路径，一个回答</text>
<line x1="60" y1="174" x2="1140" y2="174" stroke="#245ea8" stroke-width="1"/>
<rect x="60" y="192" width="30" height="30" fill="#245ea8" stroke="none" rx="15" stroke-width="1"/>
