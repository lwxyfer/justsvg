<g id="monitor" data-edge="true" data-from="canary" data-to="observe"><polyline points="1174,377 1174,431" fill="none" stroke="#939298" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#forward)"/><text x="1190" y="409" font-size="13" fill="#b0afb4" font-weight="400" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">observe</text></g>
<g id="healthy" data-edge="true" data-from="observe" data-to="promote"><polyline points="1174,515 1174,570" fill="none" stroke="#939298" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#forward)"/><text x="1190" y="548" font-size="13" fill="#b0afb4" font-weight="400" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">healthy</text></g>
<g id="unhealthy" data-edge="true" data-from="observe" data-to="rollback"><polyline points="1066,475 1027,475 1027,611 994,611" fill="none" stroke="#d8ae90" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#return)" stroke-dasharray="6 5"/><text x="1040" y="554" font-size="13" fill="#d8ae90" font-weight="400" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">errors</text></g>
<g id="restore" data-edge="true" data-from="rollback" data-to="draft"><polyline points="801,611 252,611 252,336 271,336" fill="none" stroke="#d8ae90" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#return)" stroke-dasharray="6 5"/><text x="313" y="598" font-size="13" fill="#d8ae90" font-weight="400" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">new revision after rollback</text></g>
