<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, PingFang SC, sans-serif">
<title>瑞士信息设计 · RAG 架构图</title>
<desc>设计 Prompt 见 src/examples/prompts/swiss.md。原生可编辑 SVG，演示结构。</desc>
<defs><marker id="swiss-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#181916"/></marker></defs>
<rect x="0" y="0" width="1200" height="800" fill="#f5f3ec" stroke="none" rx="0" stroke-width="1"/>
<rect x="60" y="55" width="12" height="102" fill="#d72f26" stroke="none" rx="0" stroke-width="1"/>
<text x="96" y="100" fill="#181916" font-size="52" font-weight="700">RAG. From knowledge</text>
<text x="96" y="154" fill="#181916" font-size="52" font-weight="700">to grounded answers.</text>
<line x1="60" y1="182" x2="1140" y2="182" stroke="#181916" stroke-width="2.5"/>
<text x="60" y="215" fill="#181916" font-size="16" font-weight="600">离线索引 / INDEXING</text>
<text x="60" y="505" fill="#181916" font-size="16" font-weight="600">在线回答 / ANSWERING</text>
<g id="swiss-connections" data-label="连接线"><polyline id="swiss-edge-docs-chunks" points="300,306.0 340,306.0" fill="none" stroke="#181916" stroke-width="3" stroke-linejoin="round" marker-end="url(#swiss-arrow)" data-sf-start-node="#swiss-node-docs" data-sf-end-node="#swiss-node-chunks" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="swiss-edge-chunks-embed" points="580,306.0 620,306.0" fill="none" stroke="#181916" stroke-width="3" stroke-linejoin="round" marker-end="url(#swiss-arrow)" data-sf-start-node="#swiss-node-chunks" data-sf-end-node="#swiss-node-embed" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="swiss-edge-embed-index" points="860,306.0 900,306.0" fill="none" stroke="#181916" stroke-width="3" stroke-linejoin="round" marker-end="url(#swiss-arrow)" data-sf-start-node="#swiss-node-embed" data-sf-end-node="#swiss-node-index" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="swiss-edge-query-retrieve" points="220,606.0 290,606.0" fill="none" stroke="#181916" stroke-width="3" stroke-linejoin="round" marker-end="url(#swiss-arrow)" data-sf-start-node="#swiss-node-query" data-sf-end-node="#swiss-node-retrieve" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="swiss-edge-retrieve-context" points="450,606.0 520,606.0" fill="none" stroke="#181916" stroke-width="3" stroke-linejoin="round" marker-end="url(#swiss-arrow)" data-sf-start-node="#swiss-node-retrieve" data-sf-end-node="#swiss-node-context" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="swiss-edge-context-llm" points="680,606.0 750,606.0" fill="none" stroke="#181916" stroke-width="3" stroke-linejoin="round" marker-end="url(#swiss-arrow)" data-sf-start-node="#swiss-node-context" data-sf-end-node="#swiss-node-llm" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="swiss-edge-llm-answer" points="910,606.0 980,606.0" fill="none" stroke="#181916" stroke-width="3" stroke-linejoin="round" marker-end="url(#swiss-arrow)" data-sf-start-node="#swiss-node-llm" data-sf-end-node="#swiss-node-answer" data-sf-start-anchor="1 .5 0 0" data-sf-end-anchor="0 .5 0 0"/>
<polyline id="swiss-edge-index-retrieve" points="1020,362 1020,440 370,440 370,550" fill="none" stroke="#181916" stroke-width="3" stroke-linejoin="round" marker-end="url(#swiss-arrow)" data-sf-start-node="#swiss-node-index" data-sf-end-node="#swiss-node-retrieve" data-sf-start-anchor=".5 1 0 0" data-sf-end-anchor=".5 0 0 0" stroke-dasharray="7 5"/></g>
<g id="swiss-node-docs" data-label="Documents / 文档与知识库" data-node="true"><rect x="60" y="250" width="240" height="112" fill="#ffffff" stroke="#181916" rx="0" stroke-width="2.5"/>
<text x="74" y="275" fill="#181916" font-size="13" font-weight="700">01</text>
<text x="74" y="310" fill="#181916" font-size="24" font-weight="700">Documents</text>
<text x="74" y="339" fill="#181916" font-size="14" font-weight="400">文档与知识库</text></g>
<g id="swiss-node-chunks" data-label="Chunking / 解析与切分" data-node="true"><rect x="340" y="250" width="240" height="112" fill="#ffffff" stroke="#181916" rx="0" stroke-width="2.5"/>
<text x="354" y="275" fill="#181916" font-size="13" font-weight="700">02</text>
<text x="354" y="310" fill="#181916" font-size="24" font-weight="700">Chunking</text>
<text x="354" y="339" fill="#181916" font-size="14" font-weight="400">解析与切分</text></g>
<g id="swiss-node-embed" data-label="Embeddings / 向量编码" data-node="true"><rect x="620" y="250" width="240" height="112" fill="#ffffff" stroke="#181916" rx="0" stroke-width="2.5"/>
<text x="634" y="275" fill="#181916" font-size="13" font-weight="700">03</text>
<text x="634" y="310" fill="#181916" font-size="24" font-weight="700">Embeddings</text>
<text x="634" y="339" fill="#181916" font-size="14" font-weight="400">向量编码</text></g>
<g id="swiss-node-index" data-label="Vector index / 向量索引" data-node="true"><rect x="900" y="250" width="240" height="112" fill="#f5d95d" stroke="#181916" rx="0" stroke-width="2.5"/>
<text x="914" y="275" fill="#181916" font-size="13" font-weight="700">04</text>
<text x="914" y="310" fill="#181916" font-size="24" font-weight="700">Vector index</text>
<text x="914" y="339" fill="#181916" font-size="14" font-weight="400">向量索引</text></g>
<g id="swiss-node-query" data-label="User query / 用户问题" data-node="true"><rect x="60" y="550" width="160" height="112" fill="#ffffff" stroke="#181916" rx="0" stroke-width="2.5"/>
<text x="74" y="575" fill="#181916" font-size="13" font-weight="700">05</text>
<text x="74" y="610" fill="#181916" font-size="19" font-weight="700">User query</text>
<text x="74" y="639" fill="#181916" font-size="14" font-weight="400">用户问题</text></g>
<g id="swiss-node-retrieve" data-label="Retriever / 相似度检索" data-node="true"><rect x="290" y="550" width="160" height="112" fill="#ffffff" stroke="#181916" rx="0" stroke-width="2.5"/>
<text x="304" y="575" fill="#181916" font-size="13" font-weight="700">06</text>
<text x="304" y="610" fill="#181916" font-size="19" font-weight="700">Retriever</text>
<text x="304" y="639" fill="#181916" font-size="14" font-weight="400">相似度检索</text></g>
<g id="swiss-node-context" data-label="Context / 上下文构建" data-node="true"><rect x="520" y="550" width="160" height="112" fill="#ffffff" stroke="#181916" rx="0" stroke-width="2.5"/>
<text x="534" y="575" fill="#181916" font-size="13" font-weight="700">07</text>
<text x="534" y="610" fill="#181916" font-size="19" font-weight="700">Context</text>
<text x="534" y="639" fill="#181916" font-size="14" font-weight="400">上下文构建</text></g>
<g id="swiss-node-llm" data-label="LLM / 生成模型" data-node="true"><rect x="750" y="550" width="160" height="112" fill="#d72f26" stroke="#181916" rx="0" stroke-width="2.5"/>
<text x="764" y="575" fill="#ffffff" font-size="13" font-weight="700">08</text>
<text x="764" y="610" fill="#ffffff" font-size="19" font-weight="700">LLM</text>
<text x="764" y="639" fill="#ffffff" font-size="14" font-weight="400">生成模型</text></g>
<g id="swiss-node-answer" data-label="Answer / 回答与引用" data-node="true"><rect x="980" y="550" width="160" height="112" fill="#ffffff" stroke="#181916" rx="0" stroke-width="2.5"/>
<text x="994" y="575" fill="#181916" font-size="13" font-weight="700">09</text>
<text x="994" y="610" fill="#181916" font-size="19" font-weight="700">Answer</text>
<text x="994" y="639" fill="#181916" font-size="14" font-weight="400">回答与引用</text></g>
<line x1="60" y1="714" x2="1140" y2="714" stroke="#181916" stroke-width="1"/>
<text x="60" y="747" fill="#53564c" font-size="14" font-weight="400">RAG  /  Retrieval-augmented generation</text>
<text x="60" y="775" fill="#53564c" font-size="12" font-weight="400" font-family="Arial, PingFang SC, sans-serif">演示架构 · 可编辑节点与文字 · 非生产配置</text>
</svg>
