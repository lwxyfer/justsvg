<text x="104" y="215" font-size="16" fill="#245ea8" font-weight="600" text-anchor="start">离线索引 / INDEXING</text>
<rect x="60" y="482" width="30" height="30" fill="#287b65" stroke="none" rx="15" stroke-width="1"/>
<text x="75" y="503" font-size="17" fill="#ffffff" font-weight="600" text-anchor="middle">B</text>
<text x="104" y="505" font-size="16" fill="#287b65" font-weight="600" text-anchor="start">在线回答 / ANSWERING</text>
