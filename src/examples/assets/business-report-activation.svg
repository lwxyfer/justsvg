<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Arial, PingFang SC, sans-serif" data-business-subject="activation" data-work-style="report"><title>新用户激活转化漏斗 · 正式汇报</title><desc>岗位：运营、产品。原创工作示例，内容、日期与数据均为演示。图形与文字为原生SVG。</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#faf8f3" stroke="none" stroke-width="1.3"/><text x="64" y="102" font-size="52" fill="#21354b" font-weight="400" font-family="Georgia, Songti SC, serif">新用户激活转化漏斗</text><text x="67" y="153" font-size="21" fill="#54677c" font-weight="400" >同一批用户从访问到完成团队交付的逐步转化</text><text x="1536" y="192" font-size="18" fill="#54677c" font-weight="400" text-anchor="end">运营 / 产品 · 正式汇报</text><polyline points="64,208 1536,208" fill="none" stroke="#c3cbd2" stroke-width="1.8" /><text x="64" y="265" font-size="20" fill="#405f77" font-weight="600" >核心判断</text><text x="64" y="305" font-size="20" fill="#21354b" font-weight="400" >同一人群与观察窗口</text><text x="64" y="415" font-size="20" fill="#405f77" font-weight="600" >协作重点</text><text x="64" y="455" font-size="20" fill="#21354b" font-weight="400" >人数与条宽成比例</text><text x="64" y="565" font-size="20" fill="#405f77" font-weight="600" >下一步</text><text x="64" y="605" font-size="20" fill="#21354b" font-weight="400" >整体交付转化率为5%</text><g id="business-report-activation-diagram" transform="translate(344 230) scale(0.81)"><defs><marker id="business-report-activation-arrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#405f77"/></marker></defs><g id="business-report-activation-step-0" data-node="true" data-label="访问落地页" data-layout="70 28 980 75"><rect x="70" y="28" width="980" height="75" rx="0" fill="#d5e2f0" stroke="#819fbd" stroke-width="1.3"/></g><g id="business-report-activation-step-1" data-node="true" data-label="注册账号" data-layout="364 143 392 75"><rect x="364" y="143" width="392" height="75" rx="0" fill="#b3c8e1" stro