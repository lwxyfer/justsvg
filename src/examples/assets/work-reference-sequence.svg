<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Arial, PingFang SC, sans-serif" data-workplace="sequence"><title>支付请求 · 时序与异步回调</title><desc>从用户确认到支付渠道回调，区分请求、响应与事件通知。示意数据，非生产配置。</desc><defs><marker id="work-reference-sequence-arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#6b7178"/></marker><marker id="work-reference-sequence-crow" viewBox="0 0 12 12" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12 0L0 6L12 12M0 6H12" stroke="#6b7178" fill="none"/></marker></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#fdfdfd" stroke="none" stroke-width="2"/><text x="56" y="66" font-size="36" fill="#292b2f" font-weight="700" >支付请求 · 时序与异步回调</text><text x="56" y="106" font-size="19" fill="#6b7178" font-weight="400" >从用户确认到支付渠道回调，区分请求、响应与事件通知</text><polyline id="work-reference-sequence-edge-0" points="230,330 610,330" fill="none" stroke="#6b7178" stroke-width="2" marker-end="url(#work-reference-sequence-arrow)" data-sf-start-node="#work-reference-sequence-actor0" data-sf-end-node="#work-reference-sequence-actor1" data-sf-start-anchor="0.5 1 0 86" data-sf-end-anchor="0.5 1 0 86"/><polyline id="work-reference-sequence-edge-1" points="610,420 990,420" fill="none" stroke="#6b7178" stroke-width="2" marker-end="url(#work-reference-sequence-arrow)" data-sf-start-node="#work-reference-sequence-actor1" data-sf-end-node="#work-reference-sequence-actor2" data-sf-start-anchor="0.5 1 0 176" data-sf-end-anchor="0.5 1 0 176"/><polyline id="work-reference-sequence-edge-2" points="990,510 1370,510" fill="none" stroke="#6b7178" stroke-width="2" marker-end="url(#work-reference-sequence-arrow)" data-sf-start-node="#work-reference-sequence-actor2" data-sf-end-node="#work-reference-sequence-actor3" data-sf-start-anchor="0.5 1 0 266" data-sf-end-anchor="0.5 1 0 266"/><polyline id="work-reference-sequence-edge-3" points="1370,600 990,600" fill="none" stroke-dasharray="8 6" stroke="#6b7178" stroke-width="2" marker-end="url(#work-reference-sequence-arrow)" data-sf-start-node="#work-reference-sequence-actor3" data-sf-end-node="#work-reference-sequence-actor2" data-sf-start-anchor="0.5 1 0 356" data-sf-end-anchor="0.5 1 0 356"/><polyline id="work-reference-sequence-edge-4" points="990,690 230,690" fill="none" stroke-dasharray="8 6" stroke="#6b7178" stroke-width="2" marker-end="url(#work-reference-sequence-arrow)" data-sf-start-node="#work-reference-sequence-actor2" data-sf-end-node="#work-reference-sequence-actor0" data-sf-start-anchor="0.5 1 0 446" data-sf-end-anchor="0.5 1 0 446"/><polyline id="work-reference-sequence-edge-5" points="1370,780 990,780" fill="none" stroke="#6b7178" stroke-width="2" marker-end="url(#work-reference-sequence-arrow)" data-sf-start-node="#work-reference-sequence-actor3" data-sf-end-node="#work-reference-sequence-actor2" data-sf-start-anchor="0.5 1 0 536" data-sf-end-anchor="0.5 1 0 536"/><polyline id="work-reference-sequence-edge-6" points="990,860 610,860" fill="none" stroke="#6b7178" stroke-width="2" marker-end="url(#work-reference-sequence-arrow)" data-sf-start-node="#work-reference-sequence-actor2" data-sf-end-node="#work-reference-sequence-actor1" data-sf-start-anchor="0.5 1 0 616" data-sf-end-anchor="0.5 1 0 616"/><g id="work-reference-sequence-actor0" data-node="true" data-label="用户端" data-layout="100 166 260 78"><rect x="100" y="166" width="260" height="78" rx="8" fill="#e5ecfc" stroke="#2451c4" stroke-width="2"/><text x="124" y="214" font-size="24" fill="#292b2f" font-weight="600" >用户端</text><polyline points="230,248 230,874" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/></g><g id="work-reference-sequence-actor1" data-node="true" data-label="订单服务" data-layout="480 166 260 78"><rect x="480" y="166" width="260" height="78" rx="8" fill="#e5ecfc" stroke="#2451c4" stroke-width="2"/><text x="504" y="214" font-size="24" fill="#292b2f" font-weight="600" >订单服务</text><polyline points="610,248 610,874" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/></g><g id="work-reference-sequence-actor2" data-node="true" data-label="支付服务" data-layout="860 166 260 78"><rect x="860" y="166" width="260" height="78" rx="8" fill="#e5ecfc" stroke="#2451c4" stroke-width="2"/><text x="884" y="214" font-size="24" fill="#292b2f" font-weight="600" >支付服务</text><polyline points="990,248 990,874" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/></g><g id="work-reference-sequence-actor3" data-node="true" data-label="支付渠道" data-layout="1240 166 260 78"><rect x="1240" y="166" width="260" height="78" rx="8" fill="#e5ecfc" stroke="#2451c4" stroke-width="2"/><text x="1264" y="214" font-size="24" fill="#292b2f" font-weight="600" >支付渠道</text><polyline points="1370,248 1370,874" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/></g><text x="254" y="315" font-size="20" fill="#6b7178" font-weight="400" >确认订单</text><text x="634" y="405" font-size="20" fill="#6b7178" font-weight="400" >创建支付单</text><text x="1014" y="495" font-size="20" fill="#6b7178" font-weight="400" >渠道下单（幂等键）</text><text x="1014" y="585" font-size="20" fill="#6b7178" font-weight="400" >返回支付凭据</text><text x="254" y="675" font-size="20" fill="#6b7178" font-weight="400" >返回待支付结果</text><text x="1014" y="765" font-size="20" fill="#6b7178" font-weight="400" >异步通知：支付成功</text><text x="634" y="845" font-size="20" fill="#6b7178" font-weight="400" >更新订单状态</text><text x="72" y="930" font-size="18" fill="#6b7178" font-weight="400" >从上到下为时间顺序；虚线为响应，实线为请求或异步通知。支付结果需服务端校验。</text><text x="56" y="970" font-size="16" fill="#6b7178" font-weight="400" >工作场景示例 · 数据与部署均为演示 · 原生文字 / 分组 / 关联线可编辑</text></svg>
