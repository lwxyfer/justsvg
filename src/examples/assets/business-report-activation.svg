 fill="#21354b" font-weight="600" text-anchor="middle">1000</text><text x="1100" y="468" font-size="19" fill="#54677c" font-weight="400" >下一步转化 50%</text><text x="1100" y="514" font-size="23" fill="#54677c" font-weight="400" >完成团队交付</text><text x="1100" y="546" font-size="19" fill="#54677c" font-weight="400" >500 人 · 交付闭环</text><text x="560" y="535" font-size="22" fill="#21354b" font-weight="600" text-anchor="middle">500</text><text x="70" y="640" font-size="19" fill="#54677c" font-weight="400" >整体转化率 5% · 人数与条宽按相同比例 · 同一批用户、同一观察窗口</text><text x="70" y="679" font-size="19" fill="#54677c" font-weight="400" >演示数据：2026 年第三季度新增访问用户；实际项目请替换口径与来源。</text></g><text x="64" y="885" font-size="18" fill="#54677c" font-weight="400" >可编辑工作示例 · 情境、计划与数据为演示 · 请按实际业务补充口径、证据与责任</text><text x="64" y="942" font-size="20" fill="#405f77" font-weight="400" >讨论目标：同一人群与观察窗口；整体交付转化率为5%。</text></svg>
