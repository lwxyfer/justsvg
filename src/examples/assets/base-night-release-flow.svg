<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Arial, PingFang SC, sans-serif" data-visual-style="night"><title>发布交付流程 · 含失败回路</title><desc>基础流程演变 · 角色泳道、发布判断、失败重试与运行回滚</desc><defs><marker id="base-night-release-flow-arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#92b4dc"/></marker><marker id="base-night-release-flow-arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e8c17b"/></marker><marker id="base-night-release-flow-arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#77d5b0"/></marker><marker id="base-night-release-flow-arrow-scope" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a8bbd2"/></marker></defs><rect x="0" y="0" width="1400" height="900" fill="#0e1728" stroke="none" rx="0" stroke-width="1.2"/><text x="40" y="48" font-size="28" fill="#edf3fc" font-weight="700" text-anchor="start">发布交付流程 · 含失败回路</text><text x="40" y="78" font-size="13" fill="#a8bbd2" font-weight="400" text-anchor="start">基础流程演变 · 角色泳道、发布判断、失败重试与运行回滚</text><path d="M40 106h36" fill="none" stroke="#92b4dc" stroke-width="1.8"/><text x="86" y="110" font-size="12" fill="#b7c8dd" font-weight="400" text-anchor="start">主流程 / 通过</text><path d="M270 106h36" fill="none" stroke="#e8c17b" stroke-width="1.8" stroke-dasharray="6 4"/><text x="316" y="110" font-size="12" fill="#b7c8dd" font-weight="400" text-anchor="start">异常 / 返工</text><g id="base-night-release-flow-layer-dev" data-label="研发"><rect x="32" y="132" width="1336" height="140" fill="#142238" stroke="#476c99" rx="4" stroke-width="1.2"/><text x="48" y="161" font-size="15" fill="#bfd9ff" font-weight="600" text-anchor="start">研发</text><g id="base-night-release-flow-node-commit" data-node="true" data-label="提交变更"><rect x="190" y="172" width="180" height="72" fill="#192d48" stroke="#476c99" rx="4" stroke-width="1.2"/><text x="204" y="200" font-size="17" fill="#bfd9ff" font-weight="600" text-anchor="start">提交变更</text><text x="204" y="224" font-size="13" fill="#b7c8dd" font-weight="400" text-anchor="start">代码 · 测试 · 描述</text></g><g id="base-night-release-flow-node-review" data-node="true" data-label="代码评审"><rect x="490" y="172" width="180" height="72" fill="#192d48" stroke="#476c99" rx="4" stroke-width="1.2"/><text x="504" y="200" font-size="17" fill="#bfd9ff" font-weight="600" text-anchor="start">代码评审</text><text x="504" y="224" font-size="13" fill="#b7c8dd" font-weight="400" text-anchor="start">设计检查 · 同行审核</text></g><g id="base-night-release-flow-node-merge" data-node="true" data-label="合并主干"><rect x="790" y="172" width="180" height="72" fill="#192d48" stroke="#476c99" rx="4" stroke-width="1.2"/><text x="804" y="200" font-size="17" fill="#bfd9ff" font-weight="600" text-anchor="start">合并主干</text><text x="804" y="224" font-size="13" fill="#b7c8dd" font-weight="400" text-anchor="start">受保护分支 · 触发构建</text></g></g><g id="base-night-release-flow-layer-ci" data-label="交付流水线"><rect x="32" y="332" width="1336" height="156" fill="#142238" stroke="#7565a7" rx="4" stroke-width="1.2"/><text x="48" y="361" font-size="15" fill="#d8cbff" font-weight="600" text-anchor="start">交付流水线</text><g id="base-night-release-flow-node-build" data-node="true" data-label="构建制品"><rect x="790" y="376" width="180" height="72" fill="#29253f" stroke="#7565a7" rx="4" stroke-width="1.2"/><text x="804" y="404" font-size="17" fill="#d8cbff" font-weight="600" text-anchor="start">构建制品</text><text x="804" y="428" font-size="13" fill="#b7c8dd" font-weight="400" text-anchor="start">版本标记 · 依赖检查</text></g><g id="base-night-release-flow-node-checks" data-node="true" data-label="自动化校验"><rect x="1090" y="376" width="180" height="72" fill="#2925