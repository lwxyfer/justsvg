<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Release with a return path.</title><desc id="diagram-desc">发布流程 · 每个判断，都有明确去向</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#242822" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1280" height="940" fill="#fbfaf7" stroke="none" rx="0"/><text x="64" y="83" font-size="46" fill="#242822" font-weight="400" text-anchor="start" font-family="Georgia, Songti SC, serif">Release with a return path.</text><text x="66" y="126" font-size="20" fill="#565b52" font-weight="400" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">发布流程 · 每个判断，都有明确去向</text><path d="M64 157H1216" fill="none" stroke="#d7d7ce" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="195" font-size="13" fill="#565b52" font-weight="600" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">01  PREPARE</text><text x="390" y="195" font-size="13" fill="#565b52" font-weight="600" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">02  VERIFY</text><text x="1030" y="195" font-size="13" fill="#565b52" font-weight="600" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">03  RELEASE</text>
<g id="build" data-edge="true" data-from="draft" data-to="checks"><polyline points="284,285 386,285" fill="none" stroke="#242822" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/></g>
<g id="assess" data-edge="true" data-from="checks" data-to="gate"><polyline points="614,285 756,285" fill="none" stroke="#242822" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/></g>
<g id="pass" data-edge="true" data-from="gate" data-to="canary"><polyline points="944,285 1026,285" fill="none" stroke="#242822" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="965" y="270" font-size="13" fill="#242822" font-weight="500" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">pass</text></g>
<g id="fail" data-edge="true" data-from="gate" data-to="rework"><polyline points="850,364 850,430 500,430 500,486" fill="none" stroke="#80552d" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="865" y="403" font-size="13" fill="#80552d" font-weight="500" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">revise</text></g>
<g id="retry" data-edge="true" data-from="rework" data-to="checks"><polyline points="386,545 340,545 340,385 440,385 440,349" fill="none" stroke="#80552d" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="349" y="411" font-size="13" fill="#80552d" font-weight="500" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">recheck</text></g>
<g id="monitor" data-edge="true" data-from="canary" data-to="observe"><polyline points="1120,349 1120,466" fill="none" stroke="#242822" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1134" y="413" font-size="13" fill="#242822" font-weight="500" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">observe</text></g>
<g id="healthy" data-edge="true" data-from="observe" data-to="promote"><polyline points="1006,550 835,550 835,706" fill="none" stroke="#242822" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="850" y="619" font-size="13" fill="#242822" font-weight="500" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">healthy</text></g>
<g id="unhealthy" data-edge="true" data-from="observe" data-to="rollback"><polyline points="1120,634 1120,706" fill="none" stroke="#80552d" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="1134" y="677" font-size="13" fill="#80552d" font-weight="500" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">errors</text></g>
<g id="restore" data-edge="true" data-from="rollback" data-to="draft"><polyline points="1120,814 1120,860 48,860 48,285 76,285" fill="none" stroke="#80552d" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="390" y="847" font-size="13" fill="#80552d" font-weight="500" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">new revision after rollback</text></g>
<g id="draft" data-node="true" data-bounds="80 240 200 90"><rect x="80" y="240" width="200" height="90" fill="#fffefb" stroke="#242822" rx="45" stroke-width="1.8"/><text x="100" y="279" font-size="23" fill="#242822" font-weight="600" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Change</text><text x="100" y="308" font-size="15" fill="#242822" font-weight="400" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">A reviewed revision</text></g>
<g id="checks" data-node="true" data-bounds="390 225 220 120"><rect x="390" y="225" width="220" height="120" fill="#fffefb" stroke="#242822" rx="3" stroke-width="1.8"/><text x="410" y="264" font-size="23" fill="#242822" font-weight="600" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Build &amp; test</text><text x="410" y="293" font-size="15" fill="#242822" font-weight="400" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Static + behavior checks</text></g>
<g id="gate" data-node="true" data-bounds="760 210 180 150"><path d="M850.0 210L940 285.0 850.0 360 760 285.0Z" fill="#f0ead9" stroke="#242822" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="850.0" y="280.0" font-size="22" fill="#242822" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Ready?</text><text x="850.0" y="306.0" font-size="13" fill="#242822" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Pass / revise</text></g>
<g id="canary" data-node="true" data-bounds="1030 225 180 120"><rect x="1030" y="225" width="180" height="120" fill="#fffefb" stroke="#242822" rx="3" stroke-width="1.8"/><text x="1050" y="264" font-size="23" fill="#242822" font-weight="600" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Canary</text><text x="1050" y="293" font-size="15" fill="#242822" font-weight="400" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Small traffic slice</text></g>
<g id="observe" data-node="true" data-bounds="1010 470 220 160"><path d="M1120.0 470L1230 550.0 1120.0 630 1010 550.0Z" fill="#f0ead9" stroke="#242822" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1120.0" y="545.0" font-size="22" fill="#242822" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Healthy?</text><text x="1120.0" y="571.0" font-size="13" fill="#242822" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Signals / errors</text></g>
<g id="promote" data-node="true" data-bounds="720 710 230 100"><rect x="720" y="710" width="230" height="100" fill="#242822" stroke="#242822" rx="3" stroke-width="1.8"/><text x="740" y="749" font-size="23" fill="#fffefb" font-weight="600" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Promote</text><text x="740" y="778" font-size="15" fill="#fffefb" font-weight="400" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Expand the rollout</text></g>
<g id="rollback" data-node="true" data-bounds="1010 710 220 100"><rect x="1010" y="710" width="220" height="100" fill="#fffefb" stroke="#242822" rx="3" stroke-width="1.8"/><text x="1030" y="749" font-size="23" fill="#242822" font-weight="600" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Rollback</text><text x="1030" y="778" font-size="15" fill="#242822" font-weight="400" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Restore prior version</text></g>
<g id="rework" data-node="true" data-bounds="390 490 220 110"><rect x="390" y="490" width="220" height="110" fill="#fffefb" stroke="#242822" rx="3" stroke-width="1.8"/><text x="410" y="529" font-size="23" fill="#242822" font-weight="600" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Revise</text><text x="410" y="558" font-size="15" fill="#242822" font-weight="400" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Address failed checks</text></g><path d="M80 903H123" fill="none" stroke="#242822" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="133" y="908" font-size="14" fill="#242822" font-weight="400" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Forward</text><path d="M270 903H313" fill="none" stroke="#80552d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="323" y="908" font-size="14" fill="#80552d" font-weight="400" text-anchor="start" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Revise / rollback</text><text x="1216" y="908" font-size="13" fill="#565b52" font-weight="400" text-anchor="end" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Illustrative flow · editable SVG</text></svg>
