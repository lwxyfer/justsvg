<line x1="60" y1="714" x2="1140" y2="714" stroke="#578877" stroke-width="1"/>
<text x="60" y="747" fill="#a7c5ba" font-size="14" font-weight="400">RAG  /  Retrieval-augmented generation</text>
<text x="60" y="767" fill="#a7c5ba" font-size="12" font-weight="400" font-family="Arial, PingFang SC, sans-serif">演示架构 · 可编辑节点与文字 · 非生产配置</text>
