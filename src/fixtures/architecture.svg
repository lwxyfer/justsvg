<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" fill="none">
<defs>
 <linearGradient id="blue-surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
</defs>
<style>.body{font-family:Inter,Arial,sans-serif;fill:#475569;font-size:13px}.heading{font-family:Inter,Arial,sans-serif;fill:#172b4d;font-weight:600}.connection{stroke:#94a3b8;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style>
<rect id="paper" width="960" height="640" fill="white"/>
<g id="diagram-title" transform="translate(56 52)"><text class="heading" font-size="27">From prompt to production</text><text class="body" y="29" fill="#64748b">A simple architecture for an AI-powered workspace</text></g>
<g id="connections"><path class="connection" d="M 276 261 H 378"/><path class="connection" d="M 590 261 H 680"/><path class="connection" d="M 484 324 V 398"/><path class="connection" d="M 788 324 V 442 H 590"/></g>
<g id="client-card" transform="translate(56 196)">
 <rect width="220" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
 <rect x="18" y="19" width="30" height="30" rx="7" fill="#eff6ff"/>
 <g transform="translate(25 27)" stroke="#3b82f6" stroke-width="1.5"><rect width="16" height="12" rx="2"/><path d="M5 16h6M8 12v4"/></g>
 <text class="heading" x="61" y="39" font-size="16">Client application</text><text class="body" x="18" y="77"><tspan x="18">Web interface</tspan><tspan x="18" dy="21">Prompts, files &amp; live previews</tspan></text>
</g>
<g id="orchestrator-card" transform="translate(378 180)">
 <rect width="212" height="146" rx="10" fill="url(#blue-surface)" stroke="#93b4ef"/>
 <rect x="18" y="19" width="30" height="30" rx="7" fill="#dbeafe"/>
 <g transform="translate(25 26)" stroke="#2563eb" stroke-width="1.5"><path d="M0 4h16M4 0v8M0 12h16M12 8v8"/></g>
 <text class="heading" x="61" y="39" font-size="16">Orchestrator</text><text class="body" x="18" y="80"><tspan x="18">Route · Reason · Execute</tspan><tspan x="18" dy="21">One clear source of truth</tspan></text>
 <circle cx="20" cy="125" r="3" fill="#2563eb"/><text class="body" x="30" y="129" font-size="11" fill="#2563eb">CORE SERVICE</text>
</g>
<g id="model-card" transform="translate(680 196)">
 <rect width="224" height="130" rx="10" fill="#fff" stroke="#cbd5e1"/>
 <rect x="18" y="19" width="30" height="30" rx="7" fill="#f0fdf4"/>
 <g transform="translate(25 26)" stroke="#16a34a" stroke-width="1.5"><path d="m8 0 2.3 5.7L16 8l-5.7 2.3L8 16l-2.3-5.7L0 8l5.7-2.3Z"/></g>
 <text class="heading" x="61" y="39" font-size="16">Model provider</text><text class="body" x="18" y="77"><tspan x="18">Language &amp; vision models</tspan><tspan x="18" dy="21">Structured, reliable output</tspan></text>
</g>
<g id="storage-card" transform="translate(378 398)">
 <rect width="212" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
 <g transform="translate(19 20)" stroke="#64748b" stroke-width="1.5"><ellipse cx="10" cy="4" rx="10" ry="4"/><path d="M0 4v14c0 5 20 5 20 0V4M0 11c0 5 20 5 20 0"/></g>
 <text class="heading" x="52" y="37" font-size="16">Document store</text><text class="body" x="18" y="70"><tspan x="18">Versioned files &amp; artifacts</tspan><tspan x="18" dy="20">Persist only what matters</tspan></text>
</g>
<g id="diagram-footer"><path d="M56 557H904" stroke="#e2e8f0"/><text class="body" x="56" y="586" font-size="11" fill="#94a3b8">REFERENCE ARCHITECTURE</text><text class="body" x="904" y="586" text-anchor="end" font-size="11" fill="#94a3b8">JustSVG · Editable example</text></g>
</svg>
