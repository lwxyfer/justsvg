<text x="68" y="209" font-size="11" fill="#b0afb4" font-weight="600" font-family="Menlo, Consolas, monospace">WORKSPACE</text>
<text x="68" y="246" font-size="14" fill="#b0afb4" font-weight="400" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Playbooks</text>
<text x="68" y="279" font-size="14" fill="#b0afb4" font-weight="400" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Operations</text>
<rect x="60" y="291" width="150" height="32" rx="5" fill="#212126" stroke="none"/>
