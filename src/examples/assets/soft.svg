<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, PingFang SC, sans-serif">
<title>柔和产品图 · RAG 架构图</title>
<desc>设计 Prompt 见 src/examples/prompts/soft.md。原生可编辑 SVG，演示结构。</desc>
<defs><marker id="soft-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7591ad"/></marker></defs>
<rect x="0" y="0" width="1200" height="800" fill="#f8fafc" stroke="none" rx="0" stroke-width="1"/>
