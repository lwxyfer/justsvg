<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1060" viewBox="0 0 1360 1060" role="img" aria-labelledby="title description">
<title id="title">Agent Evals</title>
<desc id="description">Illustrative evaluation architecture. Run repeatable trials, grade the evidence, compare with a baseline, then decide whether to release.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" stroke="none" fill="#574439" stroke-width="1"/></marker><marker id="support-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" stroke="none" fill="#8b5546" stroke-width="1"/></marker></defs>
<rect x="0" y="0" width="1360" height="1060" rx="0" fill="#f8f6ef" stroke="none"/><text x="88" y="63" fill="#775c50" font-size="13" font-weight="600" font-family="Arial, Helvetica Neue, sans-serif" text-anchor="start" letter-spacing="2.1">METHODS     /     FIELD NOTES</text><text x="86" y="136" fill="#26221e" font-size="66" font-weight="400" font-family="Georgia, Times New Roman, serif" text-anchor="start" letter-spacing="-2.0">Agent Evals</text><text x="90" y="174" fill="#554942" font-size="19" font-weight="400" font-family="Arial, Helvetica Neue, sans-serif" text-anchor="start">Run repeatable trials, grade the evidence, and compare with a baseline.</text><path d="M88 201H1272" stroke="#b9aa98" fill="none" stroke-width="1"/><text x="90" y="271" fill="#8c4735" font-size="14" font-weight="700" font-family="Arial, Helvetica Neue, sans-serif" text-anchor="start" letter-spacing="1">01</text><text x="125" y="271" fill="#372e27" font-size="22" font-weight="400" font-family="Georgia, Times New Roman, serif" text-anchor="start">The inputs</text><text x="472" y="271" fill="#8c4735" font-size="14" font-weight="700" font-family="Arial, Helvetica Neue, sans-serif" text-anchor="start" letter-spacing="1">02</text><text x="507" y="271" fill="#372e27" font-size="22" font-weight="400" font-family="Georgia, Times New Roman, serif" text-anchor="start">The trial</text><text x="917" y="271" fill="#8c4735" font-size="14" font-weight="700" font-family="Arial, Helvetica Neue, sans-serif" text-anchor="start" letter-spacing="1">03</text><text x="952" y="271" fill="#372e27" font-size="22" font-weight="400" font-family="Georgia, Times New Roman, serif" text-anchor="start">The review</text><path d="M88 992H1272" stroke="#b9aa98" fill="none" stroke-width="1"/><text x="88" y="1025" fill="#675449" font-size="14" font-weight="500" font-family="Arial, Helvetica Neue, sans-serif" text-anchor="start">Claude editorial study</text><text x="1272" y="1025" fill="#675449" font-size="12" font-weight="600" font-family="Arial, Helvetica Neue, sans-serif" text-anchor="end" letter-spacing="1">ILLUSTRATIVE ARCHITECTURE     /     02</text><path d="M490 1021h26" stroke="#574439" fill="none" stroke-width="1.5"/><text x="525" y="1025" fill="#675449" font-size="13" font-weight="400" font-family="Arial, Helvetica Neue, sans-serif" text-anchor="start">Trial and decision</text><path d="M664 1021h26" stroke="#8b5546" fill="none" stroke-width="1.5" stroke-dasharray="5 5"/><text x="699" y="1025" fill="#675449" font-size="13" font-weight="400" font-family="Arial, Helvetica Neue, sans-serif" text-anchor="start">Reference inputs</text>
