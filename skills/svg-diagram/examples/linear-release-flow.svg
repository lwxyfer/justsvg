<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
<title id="title">Release with a return path.</title>
<desc id="description">Illustrative release flow with verification, canary monitoring, revision, promotion and rollback.</desc>
<defs><marker id="forward" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#939298"/></marker><marker id="return" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d8ae90"/></marker></defs>
<rect x="0" y="0" width="1400" height="760" rx="0" fill="#111112" stroke="none"/>
<text x="48" y="42" font-size="12" fill="#a4a9e4" font-weight="600" font-family="Menlo, Consolas, monospace">ENGINEERING / PLAYBOOK</text>
<text x="48" y="92" font-size="41" fill="#f4f5f8" font-weight="600" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Release with a return path.</text>
