<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Arial, PingFang SC, sans-serif" data-business-subject="campaign" data-work-style="report"><title>营销活动全链路 · 正式汇报</title><desc>岗位：运营、项目协作。原创工作示例，内容、日期与数据均为演示。图形与文字为原生SVG。</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#faf8f3" stroke="none" stroke-width="1.3"/><text x="64" y="102" font-size="52" fill="#21354b" font-weight="400" font-family="Georgia, Songti SC, serif">营销活动全链路</text><text x="67" y="153" font-size="21" fill="#54677c" font-weight="400" >目标、内容、渠道上线、线索承接与复盘闭环</text><text x="1536" y="192" font-size="18" fill="#54677c" font-weight="400" text-anchor="end">运营 / 项目协作 · 正式汇报</text><polyline points="64,208 1536,208" fill="none" stroke="#c3cbd2" stroke-width="1.8" /><text x="64" y="265" font-size="20" fill="#405f77" font-weight="600" >核心判断</text><text x="64" y="305" font-size="20" fill="#21354b" font-weight="400" >每阶段有责任与验收</text><text x="64" y="415" font-size="20" fill="#405f77" font-weight="600" >协作重点</text><text x="64" y="455" font-size="20" fill="#21354b" font-weight="400" >承接结果反馈运营</text><text x="64" y="565" font-size="20" fill="#405f77" font-weight="600" >下一步</text><text x="64" y="605" font-size="20" fill="#21354b" font-weight="400" >来源与成本共同追踪</text><g id="business-report-campaign-diagram" transform="translate(344 230) scale(0.81)"><defs><marker id="business-report-campaign-arrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#405f77"/></marker></defs><rect x="0" y="30" width="1472" height="180" rx="0" fill="#edf3fa" stroke="none" stroke-width="1.3"/><text x="18" y="61" font-size="22" fill="#21354b" font-weight="600" >市场运营</text><rect x="0" y="230" width="1472" height="180" rx="0" fill="#f5f7fa" stroke="none" stroke-width="1.3"/><text x="18" y="261" font-size="22" fill="#21354b" font-weight="600" >产品 / 内容</text><rect x="0" y="430" width="1472" height="180" rx="0" fill="#edf3fa" stroke="none" stroke-width="1.3"/><text x="18" y="461" font-size="22" fill="#21354b" font-weight="600" >销售 / 客服</text><polyline points="320,145 345,145 345,345 370,345" fill="none" stroke="#405f77" stroke-width="1.8" id="business-report-campaign-edge-0" marker-end="url(#business-report-campaign-arrow)" data-sf-start-node="#business-report-campaign-goal" data-sf-end-node="#business-report-campaign-content" data-sf-start-anchor="1 0.5 0 0" data-sf-end-anchor="0 0.5 0 0"/><polyline points="650,345 675,345 675,145 700,145" fill="none" stroke="#405f77" stroke-width="1.8" id="business-report-campaign-edge-1" marker-end="url(#business-report-campaign-arrow)" data-sf-start-node="#business-report-campaign-content" data-sf-end-node="#business-report-campaign-launch" data-sf-start-anchor="1 0.5 0 0" data-sf-end-anchor="0 0.5 0 0"/><polyline points="980,145 1005,145 1005,545 1030,545" fill="none" stroke="#405f77" stroke-width="1.8" id="business-report-campaign-edge-2" marker-end="url(#business-report-campaign-arrow)" data-sf-start-node="#business-report-campaign-launch" data-sf-end-node="#business-report-campaign-qualify" data-sf-start-anchor="1 0.5 0 0" data-sf-end-anchor="0 0.5 0 0"/><polyline points="1170,490 1170,200" fill="none" stroke="#405f77" stroke-width="1.8" id="business-report-campaign-edge-3" marker-end="url(#business-report-campaign-arrow)" data-sf-start-node="#business-report-campaign-qualify" data-sf-end-node="#business-report-campaign-review" data-sf-start-anchor="0.5 0 0 0" data-sf-end-anchor="0.5 1 0 0"/><g id="business-report-campaign-goal" data-node="true" data-label="定义目标" data-layout="40 90 280 110"><rect x="40" y="90" width="280" height="110" rx="0" fill="#fffefa" stroke="#9bb6da" stroke-width="1.3"/><text x="58" y="124" font-size="24" fill="#21354b" font-weight="600" >定义目标</text><text x="58" y="156" font-size="19" fill="#54677c" font-weight="400" >目标：合格线索</text><text x="58" y="185" font-size="19" fill="#54677c" font-weight="400" >预算：审核后发布</text></g><g id="business-report-campaign-content" data-node="true" data-label="制作内容" data-layout="370 290 280 110"><rect x="370" y="290" width="280" height="110" rx="0" fill="#fffefa" stroke="#9bb6da" stroke-width="1.3"/><text x="388" y="324" font-size="24" fill="#21354b" font-weight="600" >制作内容</text><text x="388" y="356" font-size="19" fill="#54677c" font-weight="400" >落地页与素材</text><text x="388" y="385" font-size="19" fill="#54677c" font-weight="400" >验收：场景清晰</text></g><g id="business-report-campaign-launch" data-node="true" data-label="渠道上线" data-layout="700 90 280 110"><rect x="700" y="90" width="280" height="110" rx="0" fill="#fffefa" stroke="#9bb6da" stroke-width="1.3"/><text x="718" y="124" font-size="24" fill="#21354b" font-weight="600" >渠道上线</text><text x="718" y="156" font-size="19" fill="#54677c" font-weight="400" >投放 / 社群 / 内容</text><text x="718" y="185" font-size="19" fill="#54677c" font-weight="400" >验收：链接可追踪</text></g><g id="business-report-campaign-qualify" data-node="true" data-label="承接与分级" data-layout="1030 490 280 110"><rect x="1030" y="490" width="280" height="110" rx="0" fill="#fffefa" stroke="#9bb6da" stroke-width="1.3"/><text x="1048" y="524" font-size="24" fill="#21354b" font-weight="600" >承接与分级</text><text x="1048" y="556" font-size="19" fill="#54677c" font-weight="400" >筛选匹配需求</text><text x="1048" y="585" font-size="19" fill="#54677c" font-weight="400" >记录线索来源</text></g><g id="business-report-campaign-review" data-node="true" data-label="复盘与调整" data-layout="1030 90 280 110"><rect x="1030" y="90" width="280" height="110" rx="0" fill="#fffefa" stroke="#9bb6da" stroke-width="1.3"/><text x="1048" y="124" font-size="24" fill="#21354b" font-weight="600" >复盘与调整</text><text x="1048" y="156" font-size="19" fill="#54677c" font-weight="400" >回看转化与成本</text><text x="1048" y="185" font-size="19" fill="#54677c" font-weight="400" >确认下一轮动作</text></g><text x="20" y="680" font-size="19" fill="#54677c" font-weight="400" >闭环：每个阶段有责任、交付物和验收条件；用户响应反馈进入下一轮活动。</text></g><text x="64" y="885" font-size="18" fill="#54677c" font-weight="400" >可编辑工作示例 · 情境、计划与数据为演示 · 请按实际业务补充口径、证据与责任</text><text x="64" y="942" font-size="20" fill="#405f77" font-weight="400" >讨论目标：每阶段有责任与验收；来源与成本共同追踪。</text></svg>
