<text x="1128" y="576" font-size="9" fill="#516781" font-weight="400" text-anchor="end">ANSWER</text>
<text x="982" y="599" font-size="19" fill="#253b55" font-weight="600" text-anchor="start">Answer</text>
<text x="982" y="631" font-size="14" fill="#516781" font-weight="400" text-anchor="start">回答与引用</text></g>
<line x1="60" y1="715" x2="1140" y2="715" stroke="#607e9f" stroke-width="0.7"/>
<text x="60" y="748" font-size="14" fill="#516781" font-weight="400" text-anchor="start">RAG / Retrieval-augmented generation</text>
<text x="60" y="776" font-size="12" fill="#516781" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif">演示架构 · 可编辑节点与文字 · 非生产配置</text>
</svg>
