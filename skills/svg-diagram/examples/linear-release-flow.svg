<text x="68" y="664" font-size="10" fill="#b0afb4" font-weight="400" font-family="Menlo, Consolas, monospace">EXAMPLE</text>
<text x="250" y="201" font-size="17" fill="#f4f5f8" font-weight="600" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">Release flow</text>
<text x="1170" y="201" font-size="11" fill="#b0afb4" font-weight="600" font-family="Menlo, Consolas, monospace">RELEASE PLAYBOOK</text>
<text x="275" y="267" font-size="14" fill="#b0afb4" font-weight="600" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">01  Intake</text>
<text x="540" y="267" font-size="14" fill="#b0afb4" font-weight="600" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">02  Verification</text>
<text x="805" y="267" font-size="14" fill="#b0afb4" font-weight="600" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">03  Decision &amp; recovery</text>
<text x="1070" y="267" font-size="14" fill="#b0afb4" font-weight="600" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">04  Rollout</text>
<g id="build" data-edge="true" data-from="draft" data-to="checks"><polyline points="459,336 536,336" fill="none" stroke="#939298" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#forward)"/></g>
<g id="assess" data-edge="true" data-from="checks" data-to="gate"><polyline points="729,336 801,336" fill="none" stroke="#939298" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#forward)"/></g>
<g id="pass" data-edge="true" data-from="gate" data-to="canary"><polyline points="994,336 1066,336" fill="none" stroke="#939298" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#forward)"/><text x="1014" y="324" font-size="13" fill="#b0afb4" font-weight="400" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">pass</text></g>
<g id="fail" data-edge="true" data-from="gate" data-to="rework"><polyline points="897,377 897,431" fill="none" stroke="#d8ae90" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#return)" stroke-dasharray="6 5"/><text x="911" y="409" font-size="13" fill="#d8ae90" font-weight="400" font-family="Arial, Helvetica Neue, PingFang SC, sans-serif">revise</text></g>
