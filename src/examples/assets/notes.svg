<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Arial, PingFang SC, sans-serif">
<title>便签工作坊 · RAG 架构图</title>
<desc>原生可编辑示例。设计 Prompt 见 src/examples/prompts/notes.md。演示架构，非生产配置。</desc>
<defs><marker id="notes-arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#776d58"/></marker><marker id="notes-arrow-online" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#287b65"/></marker><marker id="notes-arrow-cross" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#635f50"/></marker></defs>
<rect x="0" y="0" width="1200" height="800" fill="#f5f4ef" stroke="none" rx="0" stroke-width="1"/>
